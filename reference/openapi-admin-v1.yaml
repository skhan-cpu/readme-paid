              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalSettings'
    put:
      operationId: updateApprovalSettings
      summary: Update branch approval settings
      description: >
        Enables or disables Branch Manager approval for transfer requests within
        the branch. When enabled, client transfer requests move to
        `pending_approval` before executing.


        **Access:** Branch Manager only.
      tags: [Approval Settings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApprovalSettingsRequest'
            example:
