                  data:
                    $ref: '#/components/schemas/BusinessOwnerClient'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/businessowner/assign:
    patch:
      operationId: assignBusinessOwnerClient
      summary: Assign Business Owner client to a different Advisor
      description: >
        Reassigns a Business Owner client to a new Advisor within the same
        branch.


        **Access:** Head Branch Manager and Root Advisor.
      tags: [Business Owner Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessOwnerId, advisorId]
              properties:
                businessOwnerId:
