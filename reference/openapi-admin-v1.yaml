openapi: 3.0.0
info:
  title: TAPP Cash Administration API
  version: 1.0.0
  description: >
    The **Administration API** covers everything an admin user (Root Advisor,
    Head Branch Manager, Branch Manager, or Advisor) needs to set up and manage
    the organization's branch network and client portfolios.


    It spans three microservices:


    | Service | Prefix | Responsibility |

    |---------|--------|----------------|

    | `tapp-branches` | `/branches/` | Branches, admin hierarchy, client
    invitations, client profiles |

    | `tapp-users` | `/users/` | Authentication, tokens, admin profiles |

    | `tapp-accounts` | `/accounts/` | Account viewing, balance export,
    statistics |


    ---


    ## Authentication


    All admin users authenticate with the same endpoint, passing their role in
    the request body.


    | Token | Lifetime | Purpose |

    |-------|----------|---------|

    | Access token | ~10 minutes (default) | All `/private/` endpoints |

    | Refresh token | ~35 minutes (default) | Renew via `GET /users/public/v1/auth/refresh` |


    Include the access token in every private request:

    ```

    Authorization: Bearer <accessToken>

    V-Client-Device-Id: <device-uuid>

    ```


    ---


    ## Role Access Summary


    | Role | Internal name | What they manage |

    |------|--------------|-----------------|

    | Root Advisor | `root` | Entire organization — branches, all admin tiers,
    all clients |

    | Head Branch Manager | `superadvisor` | Multiple branches, advisors across
    branches |

    | Branch Manager | `branchmanager` | Single branch — approval settings,
    transfer reviews |

    | Advisor | `advisor` | Own client portfolio — invite and manage Individual
    and Business Owner clients |


    ---


    ## Error Format


    ```json

    {
      "errors": [
        {
          "code": "ERROR_CODE",
          "title": "Human-readable title",
          "details": "Additional context",
          "target": "common | field",
          "source": "fieldName"
        }
      ]
    }

    ```

x-readme:
  proxy-enabled: true
servers:
  - url: https://api-{tenant}.stage2.tappbank.com
    description: Staging
    variables:
      tenant:
        default: your-org
        description: Your organization's subdomain (e.g. wire-network)
  - url: https://api-{tenant}.tappcash.com
    description: Production
    variables:
      tenant:
        default: your-org
        description: Your organization's subdomain (e.g. wire-network)

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      description: Standard error envelope returned by all services.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
    ErrorItem:
      type: object
      properties:
        title:
          type: string
          description: Human-readable error summary.
          example: "login is required and cannot be empty"
        details:
          type: string
          description: Additional context about the error.
        code:
          type: string
          description: Machine-readable error code.
          example: REQUIRED
        source:
          type: string
          description: The request field that caused the error.
          example: login
        target:
          type: string
          description: "`common` for general errors, `field` for field-level errors."
          example: field
        meta:
          type: object
          nullable: true

    Address:
      type: object
      required: [address, city, state, zipCode, country]
      properties:
        address:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "Austin"
        state:
          type: string
          example: "TX"
        zipCode:
          type: string
          example: "78701"
        country:
          type: string
          example: "US"
          default: "US"

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20

    AdminSignInRequest:
      type: object
      required: [login, password, roles]
      properties:
        login:
          type: string
          description: Email address, phone (E.164), or username.
          example: "advisor@example.com"
        password:
          type: string
          format: password
        roles:
          type: array
          description: >
            Pass the role that matches the user type signing in.
            - `root`, `superadvisor`, `branchmanager`, `advisor` — Administration users
            - `individual` — Individual customers
            - `businessowner` — Business owners
            - `businessoperator` — Business operators
          items:
            type: string
            enum: [root, superadvisor, branchmanager, advisor, individual, businessowner, businessoperator]
          example: ["advisor"]

    SignInResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: JWT valid for ~10 minutes (default; varies with tenant auto-logout settings)
            refreshToken:
              type: string
              description: JWT valid for ~35 minutes (default; varies with tenant auto-logout settings)
            user:
              type: object
              properties:
                id:
                  type: string
                email:
                  type: string
                roleName:
                  type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string

    AdminProfile:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        roleName:
          type: string
        branch:
          $ref: '#/components/schemas/BranchSummary'

    BranchSummary:
      type: object
      properties:
        id:
          type: string
        branchName:
          type: string

    Branch:
      type: object
      properties:
        id:
          type: string
        branchName:
          type: string
        description:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        activeSuperAdvisor:
          $ref: '#/components/schemas/AdminProfileSummary'
        activeBranchManager:
          $ref: '#/components/schemas/AdminProfileSummary'
        createdAt:
          type: string
          format: date-time

    AdminProfileSummary:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string

    CreateBranchRequest:
      type: object
      required: [branchName, address]
      properties:
        branchName:
          type: string
          minLength: 2
          maxLength: 50
          example: "Downtown Branch"
        description:
          type: string
          maxLength: 255
          example: "Serves the downtown metro area"
        address:
          $ref: '#/components/schemas/Address'

    UpdateBranchRequest:
      type: object
      properties:
        branchName:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          maxLength: 255
        address:
          $ref: '#/components/schemas/Address'

    CreateHeadBranchManagerRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, email, phoneNumber, SSN, address]
      properties:
        firstName:
          type: string
          example: "Alice"
        lastName:
          type: string
          example: "Smith"
        dateOfBirth:
          type: string
          example: "01/15/1985"
          description: "MM/DD/YYYY"
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          pattern: "^\\+1\\d{10}$"
          example: "+12025550101"
        SSN:
          type: string
          description: "Social Security Number"
        address:
          $ref: '#/components/schemas/Address'

    CreateAdvisorRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, email, phoneNumber, SSN, address]
      properties:
        firstName:
          type: string
          example: "Bob"
        lastName:
          type: string
          example: "Jones"
        dateOfBirth:
          type: string
          example: "03/22/1990"
          description: "MM/DD/YYYY"
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          pattern: "^\\+1\\d{10}$"
          example: "+12025550102"
        SSN:
          type: string
        license:
          type: string
          description: "Professional license number, if applicable"
        address:
          $ref: '#/components/schemas/Address'

    IndividualClient:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
          enum: [invited, onboarding, pending, active, dormant, closed, rejected]
        advisor:
          $ref: '#/components/schemas/AdminProfileSummary'
        branch:
          $ref: '#/components/schemas/BranchSummary'
        currentTier:
          type: integer
        kycErrors:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    InviteIndividualRequest:
      type: object
      required: [firstName, lastName, phoneNumber, email]
      properties:
        firstName:
          type: string
          example: "Jane"
        lastName:
          type: string
          example: "Doe"
        phoneNumber:
          type: string
          pattern: "^\\+1\\d{10}$"
          example: "+12025550103"
        email:
          type: string
          format: email
          example: "jane.doe@example.com"

    AssignClientRequest:
      type: object
      required: [advisorId]
      properties:
        advisorId:
          type: string
          description: "ID of the Advisor to reassign the client to"

    BusinessOwnerClient:
      type: object
      properties:
        id:
          type: string
        business:
          type: object
          properties:
            name:
              type: string
              description: "Legal business name"
        email:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
          enum: [invited, onboarding, pending, active, dormant, closed, rejected]
        advisor:
          $ref: '#/components/schemas/AdminProfileSummary'
        branch:
          $ref: '#/components/schemas/BranchSummary'
        currentTier:
          type: integer
        kycErrors:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    InviteBusinessOwnerRequest:
      type: object
      required: [businessName, firstName, lastName, phoneNumber, email]
      properties:
        businessName:
          type: string
          example: "Acme Corp"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Smith"
        phoneNumber:
          type: string
          pattern: "^\\+1\\d{10}$"
          example: "+12025550104"
        email:
          type: string
          format: email
          example: "john.smith@acmecorp.com"
        advisorID:
          type: string
          description: "Advisor to assign this client to (Root Advisor / HBM only)"

    AdminOperator:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
          enum: [invited, onboarding, pending, active, dormant, closed, rejected]
        businessOwner:
          type: object
          properties:
            id:
              type: string
            business:
              type: object
              properties:
                name:
                  type: string
        permissions:
          $ref: '#/components/schemas/OperatorPermissions'

    OperatorPermissions:
      type: object
      properties:
        transferFunds:
          type: boolean
        transferACH:
          type: boolean
        autoPay:
          type: boolean

    InviteOperatorRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, phoneNumber, email, address]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          example: "05/10/1992"
          description: "MM/DD/YYYY"
        phoneNumber:
          type: string
          pattern: "^\\+1\\d{10}$"
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        permissions:
          $ref: '#/components/schemas/OperatorPermissions'

    ApprovalSettings:
      type: object
      properties:
        branchId:
          type: string
        isBmApprovalRequired:
          type: boolean
          description: "When true, transfer requests require Branch Manager approval before executing"

    UpdateApprovalSettingsRequest:
      type: object
      required: [is_bm_approval_required]
      properties:
        is_bm_approval_required:
          type: boolean
          example: true

    Account:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        typeId:
          type: integer
        description:
          type: string
        balance:
          type: string
          format: decimal
        availableBalance:
          type: string
          format: decimal
        isActive:
          type: boolean
        allowWithdrawals:
          type: boolean
        allowDeposits:
          type: boolean
        userId:
          type: string
        createdAt:
          type: string
          format: date-time

    AccountBankDetails:
      type: object
      properties:
        accountNumber:
          type: string
        routingNumber:
          type: string
        iban:
          type: string
        swiftCode:
          type: string
        bankName:
          type: string

    ExternalAccount:
      type: object
      properties:
        id:
          type: string
        accountNumber:
          type: string
        routingNumber:
          type: string
        accountOwnerName:
          type: string
        bankName:
          type: string
        bankCountry:
          type: string
        isActive:
          type: boolean

    Advisor:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
        branch:
          $ref: '#/components/schemas/BranchSummary'
        createdAt:
          type: string
          format: date-time

  parameters:
    DeviceId:
      name: V-Client-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: "Unique device identifier — generate once per device and reuse"

    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        default: 1

    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

    SortParam:
      name: sort
      in: query
      schema:
        type: string
        example: "-createdAt"
      description: "Field to sort by. Prefix with `-` for descending."

    Individual:
      description: An individual user's profile and associated relationship data.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique individual user identifier.
          example: 01ed2dc1-f266-4d97-b943-14dab036b4f3
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        status:
          type: string
          enum:
            - active
            - pending
            - blocked
          example: active
        phoneNumber:
          type: string
          description: E.164 formatted phone number.
          example: '+12025551234'
        isEmailConfirmed:
          type: boolean
          example: true
        isPhoneNumberConfirmed:
          type: boolean
          example: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: '1990-03-20'
        socialSecurityNumber:
          type: string
          nullable: true
          description: Masked SSN for display.
          example: '***-**-4321'
        address:
          type: object
          nullable: true
          properties:
            addr:
              type: string
              example: 123 Main Street
            city:
              type: string
              example: New York
            state:
              type: string
              example: NY
            zipCode:
              type: string
              example: '10001'
            country:
              type: string
              example: US
        branch:
          type: object
          nullable: true
          description: The branch this individual belongs to.
          properties:
            id:
              type: string
              example: branch:23w10POfw8jTYG51y3zaz43MTM7
            name:
              type: string
              example: Main Street Branch
        advisor:
          type: object
          nullable: true
          description: The advisor assigned to this individual.
          properties:
            id:
              type: string
              example: advisor-uuid
            firstName:
              type: string
              example: John
            lastName:
              type: string
              example: Smith
            email:
              type: string
              example: advisor@example.com

    AccountsCount:
      description: Count of accounts grouped by type.
      type: object
      properties:
        count:
          type: integer
          description: Number of accounts of this type.
          example: 2
        typeID:
          type: string
          description: Account type identifier.
          example: type_checking
        typeName:
          type: string
          description: Human-readable account type name.
          example: Checking

    AccountsBalance:
      description: Total balance for accounts of a given type.
      type: object
      properties:
        amount:
          type: string
          description: Total balance amount.
          example: '10500.50'
        currencyCode:
          type: string
          example: USD
        typeID:
          type: string
          description: Account type identifier.
          example: type_checking
        typeName:
          type: string
          example: Checking

    IndividualPagination:
      description: Pagination metadata returned in list responses.
      type: object
      properties:
        total:
          type: integer
          description: Total number of matching records.
          example: 150
        page:
          type: integer
          description: Current page number.
          example: 1
        limit:
          type: integer
          description: Maximum records per page.
          example: 10

    KycTier:
      description: A KYC tier level (brief reference).
      type: object
      properties:
        id:
          type: integer
          example: 1
        level:
          type: integer
          description: Numeric tier level. Higher = more verified.
          example: 1
        name:
          type: string
          example: Basic

    KycRequest:
      description: A user's KYC verification request and its current status.
      type: object
      properties:
        id:
          type: integer
          example: 42
        status:
          type: string
          description: Review status of the KYC request.
          enum:
            - pending
            - approved
            - rejected
            - incomplete
          example: pending
        isView:
          type: boolean
          description: '`true` if the user has viewed this result.'
          example: false
        tier:
          $ref: '#/components/schemas/KycTier'
        createdAt:
          type: string
          format: date-time
          example: '2024-03-01T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-01T10:05:00Z'

paths:

  # ─────────────────────────────────────────────
  # Authentication
  # ─────────────────────────────────────────────

  /users/public/v1/auth/signin:
    post:
      operationId: adminSignIn
      summary: Sign in (all user types)
      description: >
        Authenticates any user type and returns access/refresh tokens. Pass the appropriate
        role in the `roles` array depending on the user type signing in.

        Returns an `accessToken` (~10 min default) and a `refreshToken` (~35 min default).

        **Role → User type mapping:**
        - `root`, `superadvisor`, `branchmanager`, `advisor` → Administration users
        - `individual` → Individual customers
        - `businessowner` → Business owners
        - `businessoperator` → Business operators

        **Login methods:** email address, phone number (E.164), or username.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSignInRequest'
            examples:
              adminAdvisor:
                summary: Sign in as Advisor
                value:
                  login: "advisor@example.com"
                  password: "SecurePass123!"
                  roles: ["advisor"]
              adminRoot:
                summary: Sign in as Root
                value:
                  login: "administrator@wirenetwork.com"
                  password: "SecurePass123!"
                  roles: ["root"]
              individual:
                summary: Sign in as Individual customer
                value:
                  login: "john.doe@example.com"
                  password: "SecurePass123!"
                  roles: ["individual"]
              businessOwner:
                summary: Sign in as Business Owner
                value:
                  login: "owner@example.com"
                  password: "SecurePass123!"
                  roles: ["businessowner"]
              businessOperator:
                summary: Sign in as Business Operator
                value:
                  login: "operator@example.com"
                  password: "SecurePass123!"
                  roles: ["businessoperator"]
      responses:
        '200':
          description: Successful sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          description: Invalid credentials or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role not permitted for this account or IP/user blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/public/v1/auth/refresh:
    get:
      operationId: adminRefreshToken
      summary: Refresh access token
      description: >
        Exchange a valid refresh token for a brand-new access token and refresh token pair.
        Pass both tokens as HTTP headers (no request body).

        **Important — single-use tokens:** Calling this endpoint immediately
        invalidates both the old access token and the old refresh token.
        You must save and use the new pair returned in the response.
        Re-using the old tokens after a successful refresh will return 401.
      tags: [Authentication]
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: "`Bearer <accessToken>` — the current (possibly expired) access token"
          example: "Bearer eyJhbGci..."
        - in: header
          name: X-Refresh-Token
          required: true
          schema:
            type: string
          description: The refresh token returned at sign-in
          example: "eyJhbGci..."
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token expired or invalid — user must sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/private/v1/auth/me:
    get:
      operationId: adminGetProfile
      summary: Get current admin profile
      description: Returns the full profile for the authenticated admin user.
      tags: [Authentication]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminProfile'

  /users/private/v1/auth/change_password:
    post:
      operationId: adminChangePassword
      summary: Change admin password
      description: >
        Updates the authenticated admin user's password. Requires the current
        password for verification.
      tags: [Authentication]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [previousPassword, proposedPassword, confirmPassword]
                  properties:
                    previousPassword:
                      type: string
                      description: The user's current password
                    proposedPassword:
                      type: string
                      description: The new password
                    confirmPassword:
                      type: string
                      description: Must exactly match proposedPassword
      responses:
        '200':
          description: Password updated
        '400':
          description: Validation error — current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # Branches
  # ─────────────────────────────────────────────

  /branches/private/v1/branch:
    get:
      operationId: listBranches
      summary: List branches
      description: >
        Returns a paginated list of all branches in the organization. Each
        branch entry includes the active Head Branch Manager's contact
        information.


        **Access:** Root Advisor only.
      tags: [Branches]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[name]
          in: query
          schema:
            type: string
          description: "Filter by branch name (partial match)"
      responses:
        '200':
          description: Paginated list of branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
