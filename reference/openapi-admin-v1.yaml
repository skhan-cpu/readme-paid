  # ─────────────────────────────────────────────
  # Individual Client Management
  # ─────────────────────────────────────────────

  /branches/private/v1/individual:
    get:
      operationId: listIndividualClients
      summary: List Individual clients
      description: >
        Returns a paginated list of Individual clients in the calling user's
        scope. Advisors see only their portfolio; Root Advisors see all clients
        across all branches.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [invited, onboarding, pending, active, dormant, closed, rejected]
        - name: filter[branchId]
          in: query
          schema:
            type: string
          description: "Root Advisor / HBM only — filter by branch"
        - name: filter[advisorId]
          in: query
          schema:
            type: string
          description: "Filter by Advisor ID"
        - name: search
          in: query
          schema:
            type: string
          description: "Search by name, email, or phone"
      responses:
        '200':
          description: Paginated list of Individual clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndividualClient'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      operationId: adminInviteIndividual
      summary: Invite an Individual client
      description: >
        Sends an invitation email to the specified email address. The invited
        user follows the onboarding flow to complete KYC and activate their
        account.


        **Access:** Advisor only.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteIndividualRequest'
            example:
              firstName: "Jane"
              lastName: "Doe"
              phoneNumber: "+12025550103"
              email: "jane.doe@example.com"
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IndividualClient'
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/individual/{individualId}:
    get:
      operationId: getIndividualClient
      summary: Get Individual client details
      description: >
        Returns the full profile for a specific Individual client including KYC
        status, verification tier, and any rejection errors.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: individualId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Individual client profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IndividualClient'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/individual/assign:
    patch:
      operationId: assignIndividualClient
      summary: Assign Individual client to a different Advisor
      description: >
        Reassigns an Individual client from their current Advisor to a new
        Advisor. The new Advisor must belong to the same branch.


        **Access:** Head Branch Manager and Root Advisor.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [individualId, advisorId]
              properties:
                individualId:
                  type: string
                advisorId:
                  type: string
      responses:
        '200':
          description: Client reassigned
        '400':
          description: Advisor not in same branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

