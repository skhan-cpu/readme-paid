        - name: filter[typeId]
          in: query
          schema:
            type: integer
          description: "Filter by account type"
      responses:
        '200':
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
