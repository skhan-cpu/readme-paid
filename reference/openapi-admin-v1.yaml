          in: query
          schema:
            type: string
          description: "Filter by branch ID"
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [active, pending, deleted]
      responses:
        '200':
          description: Paginated list of Advisors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Advisor'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /branches/private/v1/superadvisor:
    get:
      operationId: listHeadBranchManagers
      summary: List Head Branch Managers
      description: >
        Returns a paginated list of all Head Branch Managers (Super Advisors)
        in the organization.


        **Access:** Root Advisor only.
      tags: [Admin Hierarchy]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated list of Head Branch Managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Advisor'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /branches/private/v1/branchmanager:
    get:
      operationId: listBranchManagers
      summary: List Branch Managers
      description: >
        Returns a paginated list of all Branch Managers.


        **Access:** Root Advisor and Head Branch Manager.
      tags: [Admin Hierarchy]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[branchId]
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of Branch Managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
