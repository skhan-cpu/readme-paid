      responses:
        '200':
          description: Approval settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalSettings'
        '403':
          description: Only Branch Managers can update approval settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

