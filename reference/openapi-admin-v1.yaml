                city: "Austin"
                state: "TX"
                zipCode: "78701"
                country: "US"
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Branch'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
