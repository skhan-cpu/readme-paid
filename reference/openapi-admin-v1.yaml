                    items:
                      $ref: '#/components/schemas/Advisor'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  # ─────────────────────────────────────────────
  # Individual Client Management
  # ─────────────────────────────────────────────

  /branches/private/v1/individual:
    get:
      operationId: listIndividualClients
      summary: List Individual clients
      description: >
        Returns a paginated list of Individual clients in the calling user's
        scope. Advisors see only their portfolio; Root Advisors see all clients
        across all branches.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [invited, onboarding, pending, active, dormant, closed, rejected]
        - name: filter[branchId]
          in: query
          schema:
            type: string
          description: "Root Advisor / HBM only — filter by branch"
        - name: filter[advisorId]
          in: query
          schema:
            type: string
          description: "Filter by Advisor ID"
        - name: search
          in: query
          schema:
            type: string
          description: "Search by name, email, or phone"
      responses:
        '200':
          description: Paginated list of Individual clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndividualClient'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      operationId: adminInviteIndividual
      summary: Invite an Individual client
      description: >
        Sends an invitation email to the specified email address. The invited
        user follows the onboarding flow to complete KYC and activate their
        account.


        **Access:** Advisor only.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteIndividualRequest'
            example:
              firstName: "Jane"
              lastName: "Doe"
              phoneNumber: "+12025550103"
              email: "jane.doe@example.com"
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IndividualClient'
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/individual/{individualId}:
    get:
      operationId: getIndividualClient
      summary: Get Individual client details
      description: >
        Returns the full profile for a specific Individual client including KYC
        status, verification tier, and any rejection errors.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: individualId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Individual client profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IndividualClient'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/individual/assign:
    patch:
      operationId: assignIndividualClient
      summary: Assign Individual client to a different Advisor
      description: >
        Reassigns an Individual client from their current Advisor to a new
        Advisor. The new Advisor must belong to the same branch.


        **Access:** Head Branch Manager and Root Advisor.
      tags: [Individual Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [individualId, advisorId]
              properties:
                individualId:
                  type: string
                advisorId:
                  type: string
      responses:
        '200':
          description: Client reassigned
        '400':
          description: Advisor not in same branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # Business Owner Client Management
  # ─────────────────────────────────────────────

  /branches/private/v1/businessowner:
    get:
      operationId: listBusinessOwnerClients
      summary: List Business Owner clients
      description: >
        Returns a paginated list of Business Owner clients in the calling
        user's scope. Scope is determined by role — Advisors see their own
        portfolio; Root Advisors see all clients.
      tags: [Business Owner Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortParam'
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [invited, onboarding, pending, active, dormant, closed, rejected]
        - name: filter[branchId]
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: "Search by business name, email, or phone"
      responses:
        '200':
          description: Paginated list of Business Owner clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessOwnerClient'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      operationId: inviteBusinessOwner
      summary: Invite a Business Owner client
      description: >
        Sends an invitation email to the Business Owner. They complete KYB
        verification during onboarding before their accounts are activated.


        **Access:** Advisor only.
      tags: [Business Owner Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteBusinessOwnerRequest'
            example:
              businessName: "Acme Corp"
              firstName: "John"
              lastName: "Smith"
              phoneNumber: "+12025550104"
              email: "john.smith@acmecorp.com"
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BusinessOwnerClient'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/businessowner/{businessOwnerId}:
    get:
      operationId: getBusinessOwnerClient
      summary: Get Business Owner client details
      description: >
        Returns the full business profile including business entity details
        (legal name, EIN, registration date, legal structure, state of
        incorporation, industry code), the Business Owner's personal
        information, and KYB verification status.
      tags: [Business Owner Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: businessOwnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Business Owner client profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BusinessOwnerClient'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/businessowner/assign:
    patch:
      operationId: assignBusinessOwnerClient
      summary: Assign Business Owner client to a different Advisor
      description: >
        Reassigns a Business Owner client to a new Advisor within the same
        branch.


        **Access:** Head Branch Manager and Root Advisor.
      tags: [Business Owner Clients]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessOwnerId, advisorId]
              properties:
                businessOwnerId:
                  type: string
                advisorId:
                  type: string
      responses:
        '200':
          description: Client reassigned
        '400':
          description: Advisor not in same branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # Operator Management (Admin)
  # ─────────────────────────────────────────────

  /branches/private/v1/operator:
    post:
      operationId: createOperatorAdmin
      summary: Invite an Operator
      description: >
        Invites a new Operator for a Business Owner's account. The Operator
        receives an email with onboarding instructions.


        **Access:** Advisor only.
      tags: [Operators]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteOperatorRequest'
      responses:
        '201':
          description: Operator invitation sent
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/operator/{operatorId}:
    get:
      operationId: getOperatorAdmin
      summary: Get Operator details
      description: >
        Returns the Operator's profile including their current permissions
        and onboarding status.
      tags: [Operators]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operator profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOperator'
        '404':
          description: Operator not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateOperatorAdmin
      summary: Update Operator permissions
      description: >
        Updates the permissions granted to an Operator. Send the full
        permissions object — any permission not included is set to `false`.
      tags: [Operators]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  $ref: '#/components/schemas/OperatorPermissions'
      responses:
        '200':
          description: Operator updated
        '404':
          description: Operator not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # Approval Settings
  # ─────────────────────────────────────────────

  /branches/private/v1/approval-settings:
    get:
      operationId: getApprovalSettings
      summary: Get branch approval settings
      description: >
        Returns the current transfer approval settings for the Branch Manager's
        branch.


        **Access:** Branch Manager (or higher).
      tags: [Approval Settings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Approval settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalSettings'
    put:
      operationId: updateApprovalSettings
      summary: Update branch approval settings
      description: >
        Enables or disables Branch Manager approval for transfer requests within
        the branch. When enabled, client transfer requests move to
        `pending_approval` before executing.


        **Access:** Branch Manager only.
      tags: [Approval Settings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApprovalSettingsRequest'
            example:
              is_bm_approval_required: true
      responses:
        '200':
          description: Approval settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalSettings'
        '403':
          description: Only Branch Managers can update approval settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # Account Viewing (Admin scope)
  # ─────────────────────────────────────────────

  /accounts/private/v1/account:
    get:
      operationId: adminListAccounts
      summary: List client accounts
      description: >
        Returns a paginated list of accounts in the calling admin's scope.
        Filter by `userId` to view accounts for a specific client.


        Scope: Advisors see accounts for clients in their portfolio; Root
        Advisors see all accounts organization-wide.
      tags: [Account Management]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: filter[userId]
          in: query
          schema:
            type: string
          description: "Filter accounts by client user ID"
        - name: filter[typeId]
          in: query
          schema:
            type: integer
          description: "Filter by account type"
      responses:
        '200':
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /accounts/private/v1/account/{accountId}:
    get:
      operationId: adminGetAccount
      summary: Get account details
      description: >
        Returns full details for a specific account including balance,
        available balance, and account settings.
      tags: [Account Management]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        '404':
          description: Account not found or not in scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/private/v1/account/{accountId}/bank-details:
    get:
      operationId: adminGetAccountBankDetails
      summary: Get account bank details
      description: >
        Returns the routing number, account number, IBAN, and SWIFT code for
        the specified account.
      tags: [Account Management]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bank details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountBankDetails'

  /accounts/private/v1/account/export/individual-balances:
    get:
      operationId: exportIndividualBalances
      summary: Export individual account balances
      description: >
        Downloads an Excel (XLSX) spreadsheet of all Individual clients in the
        calling admin's scope with their current account balances. Scope is
        determined by role.


        | Role | Export scope |

        |------|-------------|

        | Root Advisor | All clients, all branches |

        | Head Branch Manager | All clients in managed branches |

        | Branch Manager | All clients in their branch |

        | Advisor | Clients in their portfolio |
      tags: [Account Management]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /external-accounts/private/v1/account:
    get:
      operationId: adminListExternalAccounts
      summary: List client external accounts
      description: >
        Returns a paginated list of external bank accounts linked by clients
        via Plaid. Filter by `userId` to view linked accounts for a specific
        client.
      tags: [Account Management]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: filter[userId]
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of external accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalAccount'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /external-accounts/private/v1/account/{accountId}:
    get:
      operationId: adminGetExternalAccount
      summary: Get external account details
      description: >
        Returns details for a specific external bank account linked by a
        client.
      tags: [Account Management]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: External account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalAccount'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
