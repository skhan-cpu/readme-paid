openapi: 3.0.0
info:
  title: TAPP Cash Business Owner API
  version: 1.0.0
  description: >
    The **Business Owner API** covers the complete lifecycle of a Business Owner
    user — from accepting the Advisor's invitation and completing KYB, through
    daily business banking operations and managing Operators.


    It spans five microservices:


    | Service | Prefix | Responsibility |

    |---------|--------|----------------|

    | `tapp-branches` | `/branches/` | Invitations, KYB signup, Operator
    management |

    | `tapp-users` | `/users/` | Authentication, tokens, security questions |

    | `tapp-accounts` | `/accounts/` | Accounts, balances, transfers,
    auto-payments |

    | `tapp-external-accounts` | `/external-accounts/` | External bank account
    linking (BaaS/Plaid) |

    | `tapp-notifications` | `/notifications/` | Notifications |


    ---


    ## Two-Phase Authentication


    Business Owner onboarding uses two token types:


    **Phase 1 — Temporary access token** (steps 3–9):

    Returned by `POST /branches/public/v1/businessowner/invites/accept` as
    `data.temporaryAccessToken`. Use only on `/limited/` endpoints.


    **Phase 2 — Full access token** (after token exchange):

    Returned by `PUT /users/private/v1/limited/token-exchange`. Use on all
    `/private/v1/` endpoints going forward.


    | Token | Lifetime | Use |

    |-------|----------|-----|

    | Temporary access token | Session | `/limited/` onboarding endpoints only |

    | Full access token | ~10 minutes (default) | All authenticated business endpoints |

    | Refresh token | ~35 minutes (default) | Renew via the Authentication API |


    Required header on all private requests:

    ```

    Authorization: Bearer <accessToken>

    V-Client-Device-Id: <device-uuid>

    ```

x-readme:
  proxy-enabled: true
servers:
  - url: https://api-{tenant}.stage2.tappbank.com/org
    description: Staging
    variables:
      tenant:
        default: testing
        description: Your organization's subdomain (e.g. wire-network)
  - url: https://api-{tenant}.tappcash.com/org
    description: Production
    variables:
      tenant:
        default: testing
        description: Your organization's subdomain (e.g. wire-network)

components:

  securitySchemes:
    OrgSessionAuth:
      type: apiKey
      in: header
      name: X-Session-Id
      description: Session ID obtained from POST /entrypoint/org/v1/sessions.
      x-default: f2990a32-dcd8-4cfb-b6ff-1a15cdffc6e2
    ClientIdAuth:
      type: apiKey
      in: header
      name: X-Client-Id
      description: The ClientId (ci_test_… or ci_live_…) used to create the session.
      x-default: ci_test_a1b2c3d4-0000-0000-0000-000000000002

  schemas:
    ErrorResponse:
      description: Standard error envelope returned by all services.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
    ErrorItem:
      type: object
      properties:
        title:
          type: string
          description: Human-readable error summary.
          example: "login is required and cannot be empty"
        details:
          type: string
          description: Additional context about the error.
        code:
          type: string
          description: Machine-readable error code.
          example: REQUIRED
        source:
          type: string
          description: The request field that caused the error.
          example: login
        target:
          type: string
          description: "`common` for general errors, `field` for field-level errors."
          example: field
        meta:
          type: object
          nullable: true

    Address:
      type: object
      required: [address, city, state, zipCode, country]
      properties:
        address:
          type: string
          example: "123 Business Ave"
        city:
          type: string
          example: "Austin"
        state:
          type: string
          example: "TX"
        zipCode:
          type: string
          example: "78701"
        country:
          type: string
          example: "US"

    Employment:
      type: object
      properties:
        isCurrentlyEmployed:
          type: boolean
        occupation:
          type: string
        employer:
          type: string
        annualIncome:
          type: string
          format: decimal
          example: "75000.00"
        employmentStartDate:
          type: string
          example: "01/15/2020"
          description: "MM/DD/YYYY"
        incomeSources:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Salary"
              amount:
                type: string
                format: decimal
              frequency:
                type: string
                example: "Monthly"

    W9Certification:
      type: object
      required: [accepted, timestamp]
      properties:
        isSubjectToBackupWithholding:
          type: boolean
        accepted:
          type: boolean
          description: "User acknowledges and accepts W9 certification terms"
        timestamp:
          type: string
          format: date-time

    TransferActivity:
      type: object
      description: >
        Transfer activity disclosures. Conditional sub-field rules:

        `internationalTransferExpected: true` → frequency, amountRange, countries **required**.
        `internationalTransferExpected: false` → those fields must not be sent (error: `INTERNATIONAL_TRANSFER_NOT_EXPECTED`).
        `internationalTransferExpected` omitted → no validation on its sub-fields.

        `cryptocurrencyTransactionExpected: true` → frequency and amountRange **required**.
        `cryptocurrencyTransactionExpected: false` → those fields must not be sent (error: `CRYPTOCURRENCY_TRANSFER_NOT_EXPECTED`).

        `cashTransactionExpected: true` → frequency and amountRange **required**.
        `cashTransactionExpected: false` → those fields must not be sent (error: `CASH_TRANSFER_NOT_EXPECTED`).
      required: [cryptocurrencyTransactionExpected, cashTransactionExpected]
      properties:
        internationalTransferExpected:
          type: boolean
          description: "Optional. Whether the business expects international wire transfers."
        internationalTransferFrequency:
          type: string
          enum: [SeveralPerMonth, OncePerMonth, OnceEveryFewMonths, OnceOrTwicePerYear]
          description: "Required when internationalTransferExpected is true."
        internationalTransferAmountRange:
          type: string
          enum: [from_0_to_9999, from_10000_to_49999, from_50000_to_99999, from_100000_to_249999, from_250000_to_499999, from_500000_to_max]
          description: "Required when internationalTransferExpected is true."
        internationalTransferCountries:
          type: array
          items:
            type: string
          description: "ISO 3166-1 alpha-3 country codes. Required when internationalTransferExpected is true."
        cryptocurrencyTransactionExpected:
          type: boolean
        cryptocurrencyTransactionFrequency:
          type: string
          enum: [SeveralPerMonth, OncePerMonth, OnceEveryFewMonths, OnceOrTwicePerYear]
          description: "Required when cryptocurrencyTransactionExpected is true."
        cryptocurrencyTransactionAmountRange:
          type: string
          enum: [from_0_to_9999, from_10000_to_49999, from_50000_to_99999, from_100000_to_249999, from_250000_to_499999, from_500000_to_max]
          description: "Required when cryptocurrencyTransactionExpected is true."
        cashTransactionExpected:
          type: boolean
        cashTransactionFrequency:
          type: string
          enum: [SeveralPerMonth, OncePerMonth, OnceEveryFewMonths, OnceOrTwicePerYear]
          description: "Required when cashTransactionExpected is true."
        cashTransactionAmountRange:
          type: string
          enum: [from_0_to_9999, from_10000_to_49999, from_50000_to_99999, from_100000_to_249999, from_250000_to_499999, from_500000_to_max]
          description: "Required when cashTransactionExpected is true."

    BusinessActivity:
      type: object
      properties:
        isHempOrCbdRelated:
          type: boolean
        isMarijuanaRelated:
          type: boolean
        isLotteryTicketSales:
          type: boolean
        isCheckCashingService:
          type: boolean
        isMoneyTransferForOthers:
          type: boolean
        isNoneOfTheAbove:
          type: boolean
        isMoneyServiceBusinessRegulatedByFinCen:
          type: boolean
        isOperatingPrivateAtm:
          type: boolean
        isProcessingInternationalTransfers:
          type: boolean
        consent:
          type: boolean
          description: "Business owner consents to the compliance disclosure"

    BusinessOwnerSignupPerson:
      type: object
      required: [firstName, lastName, dateOfBirth, socialSecurityNumber, phoneNumber, email, address, usCitizenshipStatus]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        dateOfBirth:
          type: string
          example: "01/15/1985"
          description: "MM/DD/YYYY"
        socialSecurityNumber:
          type: string
          example: "478-37-4837"
        phoneNumber:
          type: string
          pattern: "^\\+1\\d{10}$"
        email:
          type: string
          format: email
        ownershipPercentage:
          type: string
          description: "Required for Business Owner role"
          example: "51"
        businessTitle:
          type: string
          description: "Required for Controlling Party and Authorized Signer roles"
        isBeneficialOwner:
          type: boolean
        address:
          $ref: '#/components/schemas/Address'
        isSameAddress:
          type: boolean
          description: "If true, mailing address equals primary address"
        mailingAddress:
          $ref: '#/components/schemas/Address'
        employment:
          $ref: '#/components/schemas/Employment'
        usCitizenshipStatus:
          type: string
          enum: [Citizen, ResidentAlien, NonResidentAlien, Other]
          description: "US citizenship/residency status. Use 'Other' for any status not covered by the other values."
        usCitizenshipStatusDetails:
          type: string
          maxLength: 255
          description: "Required when usCitizenshipStatus is 'Other'. Free-text description of citizenship status."
        w9:
          $ref: '#/components/schemas/W9Certification'
          description: "Required for Business Owner role"

    BusinessSignupInfo:
      type: object
      required: [businessLegalName, employerIdentificationNumber, legalStructure, phoneNumber, address, transferActivity, businessActivity, taxIdentificationNumberType]
      properties:
        businessLegalName:
          type: string
          example: "Acme Corporation LLC"
        natureOfBusiness:
          type: string
          example: "Retail sales of automotive parts and accessories"
        tradeName:
          type: string
          description: "DBA (doing business as) name, if different from legal name"
        employerIdentificationNumber:
          type: string
          example: "37-2837283"
          description: "EIN format: XX-XXXXXXX"
        taxIdentificationNumberType:
          type: string
          enum: [EIN, SSN]
        hasEmployees:
          type: boolean
        legalStructure:
          type: string
          enum: [CORPORATION, LLC, PARTNERSHIP, NON-PROFIT, TRUST, SOLE PROPRIETORSHIP]
        phoneNumber:
          type: string
          pattern: "^\\+1\\d{10}$"
        email:
          type: string
          format: email
          description: "Business email address (optional)"
        stateOfIncorporation:
          type: string
          example: "TX"
        naicsCode:
          type: string
          example: "441222"
          description: "6-digit NAICS industry classification code. At least one of naicsCode or website must be provided."
        website:
          type: string
          format: uri
          description: "Business website URL. At least one of naicsCode or website must be provided."
        businessStartDate:
          type: string
          description: "Date the business was started or incorporated, in MM/DD/YYYY format. Optional."
          example: "01/15/2010"
        address:
          $ref: '#/components/schemas/Address'
        isSameAddress:
          type: boolean
        mailingAddress:
          $ref: '#/components/schemas/Address'
        transferActivity:
          $ref: '#/components/schemas/TransferActivity'
        businessActivity:
          $ref: '#/components/schemas/BusinessActivity'

    BusinessOwnerSignupRequest:
      type: object
      required: [businessOwner, controllingParty, business, w9]
      description: >
        Complete KYB signup request. Requires at minimum one Business Owner,
        one Controlling Party, a Business entity, and W9 certification. The Authorized Signer is
        optional.
      properties:
        businessOwner:
          $ref: '#/components/schemas/BusinessOwnerSignupPerson'
          description: "Primary business owner (must include ownershipPercentage)"
        controllingParty:
          $ref: '#/components/schemas/BusinessOwnerSignupPerson'
          description: "Person with control over business operations (must include businessTitle)"
        authorizedSigner:
          $ref: '#/components/schemas/BusinessOwnerSignupPerson'
          description: "Optional — person authorized to sign business transactions"
        business:
          $ref: '#/components/schemas/BusinessSignupInfo'
        w9:
          $ref: '#/components/schemas/W9Certification'
          description: "W9 tax certification — accepted on behalf of the business"

    Account:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        typeId:
          type: integer
        description:
          type: string
        balance:
          type: string
          format: decimal
        availableBalance:
          type: string
          format: decimal
        isActive:
          type: boolean
        allowWithdrawals:
          type: boolean
        allowDeposits:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ExternalAccount:
      type: object
      properties:
        id:
          type: string
        accountNumber:
          type: string
        routingNumber:
          type: string
        accountOwnerName:
          type: string
        bankName:
          type: string
        bankCountry:
          type: string
        isActive:
          type: boolean

    TBARequest:
      type: object
      properties:
        id:
          type: string
        accountIdFrom:
          type: string
        accountIdTo:
          type: string
        outgoingAmount:
          type: string
          format: decimal
        incomingAmount:
          type: string
          format: decimal
        status:
          type: string
          enum: [pending, executed, cancelled, rejected]
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    AutoPayment:
      type: object
      properties:
        id:
          type: string
        accountIdFrom:
          type: string
        accountIdTo:
          type: string
        amount:
          type: string
          format: decimal
        period:
          type: string
          enum: [weekly, biweekly, monthly, one_time]
        type:
          type: string
          enum: [end_date, until_cancel, limit_amount]
        startDate:
          type: string
        endDate:
          type: string
        limitAmount:
          type: string
          format: decimal
        status:
          type: string
        description:
          type: string

    ACHAccountIdentifiers:
      type: object
      required: [accountNumber, routingNumber, accountOwnerName, bankCountry, bankName]
      properties:
        accountNumber:
          type: string
          minLength: 8
          maxLength: 17
          description: "Numeric, 8–17 digits"
        routingNumber:
          type: string
          minLength: 9
          maxLength: 9
          description: "Numeric, exactly 9 digits"
        accountOwnerName:
          type: string
        bankCountry:
          type: string
          example: "US"
        bankName:
          type: string

    OperatorPermissions:
      type: object
      properties:
        transferFunds:
          type: boolean
          description: "Can initiate TBA and TBU transfers"
        transferACH:
          type: boolean
          description: "Can initiate ACH external transfers"
        autoPay:
          type: boolean
          description: "Can set up and manage auto-payments"

    Operator:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
          enum: [invited, onboarding, pending, active, dormant]
        permissions:
          $ref: '#/components/schemas/OperatorPermissions'
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

  parameters:
    DeviceId:
      name: V-Client-Device-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        default: 20

paths:

  # ─────────────────────────────────────────────
  # Onboarding — Public (no auth)
  # ─────────────────────────────────────────────

  /branches/public/v1/common/invites/check:
    get:
      operationId: boCheckInviteToken
      summary: Step 1 — Validate invite token
      description: >
        Validates the invite token from the invitation email. Returns the
        invitee's role and pre-filled phone number.


        Call this first to confirm the token is valid before showing the
        onboarding UI.
      tags: [Onboarding]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: "Token from the invitation email link"
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      role:
                        type: string
                        example: "businessowner"
                      phoneNumber:
                        type: string
                        example: "+12025550104"
        '400':
          description: Token expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/public/v1/common/agreements:
    get:
      operationId: boGetAgreements
      summary: Step 2 — Fetch platform agreements
      description: >
        Returns the platform agreements the Business Owner must review and
        accept before proceeding. Pass `type=Business` for business-specific
        agreement content.
      tags: [Onboarding]
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [Business]
          example: "Business"
      responses:
        '200':
          description: List of agreements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        content:
                          type: string

  /branches/public/v1/businessowner/invites/accept:
    post:
      operationId: boAcceptInvite
      summary: Step 3 — Accept invitation and set password
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      description: >
        Accepts the invitation and sets the Business Owner's password. Returns
        HTTP **403** on success (this is by design — not an error).


        The response body contains `data.temporaryAccessToken`. Extract and
        store it for use in steps 4–9.


        The `meta.fields` array lists remaining required steps:

        - `"phoneNumber"` — phone OTP steps (7–8) are required

        - `"kyc"` — KYB signup (step 9) is required
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: "Invite token from the email link"
                password:
                  type: string
                  description: "New password the Business Owner is setting"
      responses:
        '403':
          description: HTTP 403 with ErrorResponse body when the token or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: >
            Success — HTTP 403 is intentional for the invite-accept step. Extract
            `data.temporaryAccessToken` from the body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      temporaryAccessToken:
                        type: string
                  meta:
                    type: object
                    properties:
                      fields:
                        type: array
                        items:
                          type: string
                        example: ["phoneNumber", "kyc"]

  # ─────────────────────────────────────────────
  # Onboarding — Limited (temporary token)
  # ─────────────────────────────────────────────

  /branches/private/v1/limited/w9/terms:
    get:
      operationId: boGetW9Terms
      summary: Step 4 — Get W9 terms
      description: >
        Returns the W9 certification terms. The Business Owner must review and
        acknowledge these terms as part of onboarding.
      tags: [Onboarding]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: backupWithholding
          in: query
          required: false
          schema:
            type: boolean
            example: true
          description: >
            Pass `true` if the Business Owner is subject to backup withholding.
            Affects the W9 terms content returned.
      responses:
        '200':
          description: W9 terms content
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content:
                        type: string

  /users/private/v1/limited/security-questions:
    get:
      operationId: boListSecurityQuestions
      summary: Step 5 — List security questions
      description: >
        Returns the list of security questions the Business Owner must answer.
        Display these and collect answers for step 6.
      tags: [Onboarding]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Security questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        question:
                          type: string

  /users/private/v1/limited/security-questions/answers:
    post:
      operationId: boSubmitSecurityAnswers
      summary: Step 6 — Submit security answers
      description: >
        Submits the Business Owner's answers to the security questions selected
        in step 5.
      tags: [Onboarding]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId, answer]
                    properties:
                      questionId:
                        type: integer
                        minimum: 1
                        maximum: 1000
                        example: 1
                      answer:
                        type: string
                        example: Seattle
          examples:
            Three distinct answers:
              value:
                answers:
                  - questionId: 1
                    answer: Seattle
                  - questionId: 5
                    answer: Buddy
                  - questionId: 9
                    answer: Blue
      responses:
        '200':
          description: Answers accepted
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/private/v1/limited/generate-new-phone-code:
    post:
      operationId: boSendPhoneOTP
      summary: Step 7 — Send phone OTP
      description: >
        Sends a one-time verification code to the Business Owner's phone number
        on file.
      tags: [Onboarding]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: OTP sent

  /users/private/v1/limited/check-phone-code:
    put:
      operationId: boVerifyPhoneOTP
      summary: Step 8 — Verify phone OTP
      description: >
        Verifies the one-time code sent to the Business Owner's phone. Must be
        completed before submitting KYB information.
      tags: [Onboarding]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: "OTP received via SMS"
      responses:
        '200':
          description: Phone verified
        '400':
          description: Incorrect or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/limited/businessowner/signup:
    post:
      operationId: submitKYB
      summary: Step 9 — Submit KYB information
      description: >
        Submits the complete KYB (Know Your Business) package — business entity
        details, Business Owner personal information, Controlling Party, and
        optionally an Authorized Signer.


        After submission the KYB review is processed asynchronously. The status
        moves from `pending` to `approved` or `rejected`. Poll
        `GET /kyc/private/v1/requests/last` after token exchange (step 10) to
        monitor the result.


        **Required parties:**

        - **businessOwner** — at least one beneficial owner with ≥25%
        ownership (must include `ownershipPercentage` and `w9`)

        - **controllingParty** — person with authority over business operations
        (must include `businessTitle`)

        - **authorizedSigner** — optional, person authorized to sign for
        transactions


        **Required business fields:** `businessLegalName`,
        `employerIdentificationNumber`, `legalStructure`, `transferActivity`,
        `businessActivity`, `taxIdentificationNumberType`
      tags: [Onboarding]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessOwnerSignupRequest'
            example:
              businessOwner:
                middleName: "test"
                phoneNumber: "+13218271965"
                dateOfBirth: "01/01/1987"
                socialSecurityNumber: "478-37-4837"
                ownershipPercentage: "26"
                businessTitle: "title"
                usCitizenshipStatus: "Citizen"
                isSameAddress: true
                address:
                  address: "test"
                  city: "city"
                  state: "MI"
                  zipCode: "22222"
                  country: "US"
                mailingAddress:
