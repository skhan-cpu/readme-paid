        Exchanges the temporary access token for a full `accessToken` and
        `refreshToken`. After this step onboarding is complete and the Business
        Owner can access all business banking features.
      tags: [Onboarding]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
