  # ─────────────────────────────────────────────
  # Authentication (returning users)
  # ─────────────────────────────────────────────

  # ─────────────────────────────────────────────
  # KYB Status
  # ─────────────────────────────────────────────

  /kyc/private/v1/requests/last:
    get:
      operationId: boGetKYBStatus
      summary: Get KYB verification status
      description: >
        Returns the most recent KYB request and its verification status. Poll
        this after completing onboarding step 10 to know when the Business
        Owner's account is fully verified and active.


        | Status | Meaning |

        |--------|---------|

        | `pending` | KYB submitted and under review |

        | `approved` | Business verified — full account access active |

        | `rejected` | KYB failed — see `errors` for reasons |
      tags: [KYB Status]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Most recent KYB request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum: [pending, approved, rejected]
                      errors:
                        type: array
                        items:
                          type: string

  # ─────────────────────────────────────────────
  # Accounts
  # ─────────────────────────────────────────────

  /accounts/private/v1/account:
    get:
      operationId: boListAccounts
      summary: List business accounts
      description: >
        Returns all accounts belonging to the authenticated Business Owner.
      tags: [Accounts]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /accounts/private/v1/account/{accountId}:
    get:
      operationId: boGetAccount
      summary: Get account details
      description: >
        Returns details for a specific account — balance, available balance,
        and account settings.
      tags: [Accounts]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'

  /accounts/private/v1/account/{accountId}/bank-details:
    get:
      operationId: boGetAccountBankDetails
      summary: Get account bank details
      description: >
        Returns routing number, account number, IBAN, and SWIFT code. Use to
        display account details for incoming wire transfers.
      tags: [Accounts]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bank details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accountNumber:
                        type: string
                      routingNumber:
                        type: string
                      iban:
                        type: string
                      swiftCode:
                        type: string

  /accounts/private/v1/balance/total:
    get:
      operationId: boGetTotalBalance
      summary: Get total balance
      description: >
        Returns the aggregate balance across all of the Business Owner's
        accounts, including available and pending amounts.
      tags: [Accounts]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Total balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: string
                        format: decimal
                      available:
                        type: string
                        format: decimal
                      pending:
                        type: string
                        format: decimal

  # ─────────────────────────────────────────────
  # Transfers — TBA (between own accounts)
  # ─────────────────────────────────────────────

  /accounts/private/v1/tba-requests/preview:
    post:
      operationId: boPreviewTBATransfer
      summary: Preview TBA Transfer
      description: >
        Calculates the fee and final amounts for a **Transfer Between Accounts
        (TBA)** — an internal transfer between the Business Owner's own accounts
        (e.g. Checking to Savings or vice versa).


        Always call this endpoint before submitting a TBA transfer. Display the
        returned fee breakdown to the user so they can confirm before the
        transfer is created.
      tags: [Transfers]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountIdFrom, accountIdTo]
              properties:
                accountIdFrom:
                  type: integer
                  description: "Source account ID"
                accountIdTo:
                  type: integer
                  description: "Destination account ID (must differ from accountIdFrom)"
                outgoingAmount:
                  type: string
                  format: decimal
                  description: "Amount to send (must be > 0)"
                incomingAmount:
                  type: string
                  format: decimal
                  description: "Amount to receive (specify either outgoing or incoming)"
      responses:
        '200':
          description: Transfer preview with fees
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      outgoingAmount:
                        type: string
                        format: decimal
                      incomingAmount:
                        type: string
                        format: decimal
                      fee:
                        type: string
                        format: decimal

  /accounts/private/v1/tba-requests:
    post:
      operationId: boCreateTBATransfer
      summary: Create internal transfer (TBA)
      description: >
        Executes a Transfer Between Accounts — moves funds between two accounts
        belonging to this Business Owner. Confirm amounts from the preview
        response before calling.
      tags: [Transfers]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountIdFrom, accountIdTo, outgoingAmount, incomingAmount]
              properties:
                accountIdFrom:
                  type: integer
                accountIdTo:
                  type: integer
                outgoingAmount:
                  type: string
                  format: decimal
                  description: "Must be > 0"
                incomingAmount:
                  type: string
                  format: decimal
                  description: "Must be > 0"
                description:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Transfer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TBARequest'

  # ─────────────────────────────────────────────
  # Transfers — ACH (external accounts)
  # ─────────────────────────────────────────────

  /external-accounts/private/v1/baas/auth-token:
    post:
      operationId: boGetBaaSToken
      summary: Get BaaS auth token (for Plaid)
      description: >
        Step 1 of ACH setup — retrieves a BaaS authentication token used to
        initialize the Plaid Link SDK session. Display the Plaid Link UI to
        the user to select and connect their external bank account.
      tags: [Transfers]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: BaaS token for Plaid SDK initialization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string

  /external-accounts/private/v1/account:
    get:
      operationId: boListExternalAccounts
      summary: List linked external accounts
      description: >
        Returns all external bank accounts linked by the Business Owner via
        Plaid.
      tags: [Transfers]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Linked external accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalAccount'

  /accounts/private/v1/ext-requests/preview:
    post:
      operationId: boPreviewACHTransfer
      summary: Preview ACH Transfer
      description: >
        Calculates the fee and final amounts for an **ACH transfer** between the
        Business Owner's TAPP Cash account and a linked external bank account.
        Supports both outbound (account → external) and inbound (external →
        account) directions.


        Always call this endpoint before submitting an ACH transfer. Display the
        returned fee breakdown to the user so they can confirm before the
        transfer is created.
      tags: [Transfers]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId, toAccountId, amount]
              properties:
                fromAccountId:
                  type: string
                  description: "Source account ID (internal or external)"
                toAccountId:
                  type: string
                  description: "Destination account ID (internal or external)"
                amount:
                  type: string
                  format: decimal
                  description: "Amount to transfer (must be > 0)"
      responses:
        '200':
          description: Transfer preview with fee breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      amount:
                        type: string
                        format: decimal
                      fee:
                        type: string
                        format: decimal
                      totalDeducted:
                        type: string
                        format: decimal

  /accounts/private/v1/ext-requests:
    post:
      operationId: boCreateACHTransfer
      summary: Create ACH transfer
      description: >
        Executes an ACH pull or push between a TAPP Cash account and a linked
        external bank account. Confirm amounts from the preview before calling.
      tags: [Transfers]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId, toAccountId, amount]
              properties:
                fromAccountId:
                  type: string
                toAccountId:
                  type: string
                amount:
                  type: string
                  format: decimal
                description:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: ACH transfer initiated
        '400':
          description: Validation error or transfer limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # Auto-Payments
  # ─────────────────────────────────────────────

  /accounts/private/v1/auto-payment/preview:
    post:
      operationId: boPreviewAutoPayment
      summary: Preview auto-payment
      description: >
        Returns a preview of a recurring payment — fee breakdown and the net
        amount that will be sent each period. Preview before creating.
      tags: [Auto-Payments]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountIdFrom, amount]
              properties:
                accountIdFrom:
                  type: string
                accountIdTo:
                  type: string
                  description: "TAPP Cash account ID (use this or accountToACH, not both)"
                amount:
                  type: string
                  format: decimal
                accountToACH:
                  $ref: '#/components/schemas/ACHAccountIdentifiers'
                  description: "External bank account (use this or accountIdTo, not both)"
      responses:
        '200':
          description: Auto-payment preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      amount:
                        type: string
                        format: decimal
                      fee:
                        type: string
                        format: decimal

  /accounts/private/v1/auto-payment:
    post:
      operationId: boCreateAutoPayment
      summary: Create auto-payment
      description: >
        Sets up a recurring scheduled payment. Choose a period (weekly,
        biweekly, monthly, or one-time) and a stop condition (end date, cancel
        manually, or limit reached).
      tags: [Auto-Payments]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountIdFrom, amount, period, type, startDate]
              properties:
                accountIdFrom:
                  type: string
                accountIdTo:
                  type: string
                amount:
                  type: string
                  format: decimal
                period:
                  type: string
                  enum: [weekly, biweekly, monthly, one_time]
                type:
                  type: string
                  enum: [end_date, until_cancel, limit_amount]
                startDate:
                  type: string
                  example: "01/20/2025"
                  description: "MM/DD/YYYY — must be at least the next calendar day"
                endDate:
                  type: string
                  description: "Required when type=end_date. MM/DD/YYYY, must be >= startDate"
                limitAmount:
                  type: string
                  format: decimal
                  description: "Required when type=limit_amount — total amount cap"
                description:
                  type: string
                  maxLength: 255
                accountToACH:
                  $ref: '#/components/schemas/ACHAccountIdentifiers'
      responses:
        '201':
          description: Auto-payment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AutoPayment'
    get:
      operationId: boListAutoPayments
      summary: List auto-payments
      description: >
        Returns all auto-payments created by or for the Business Owner,
        including their status and next scheduled run date.
      tags: [Auto-Payments]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated auto-payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutoPayment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /accounts/private/v1/auto-payment/{autoPaymentId}:
    get:
      operationId: boGetAutoPayment
      summary: Get auto-payment details
      description: >
        Returns full details for a specific auto-payment including preview of
        the next scheduled payment.
      tags: [Auto-Payments]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: autoPaymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Auto-payment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AutoPayment'

  /accounts/private/v1/auto-payment/{autoPaymentId}/cancel:
    put:
      operationId: boCancelAutoPayment
      summary: Cancel auto-payment
      description: >
        Cancels a scheduled auto-payment. The cancellation takes effect
        immediately — no further payments will be processed.
      tags: [Auto-Payments]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: autoPaymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Auto-payment cancelled

  # ─────────────────────────────────────────────
  # Operator Management
  # ─────────────────────────────────────────────

  /branches/private/v1/operator:
    post:
      operationId: boInviteOperator
      summary: Invite an Operator
      description: >
        Invites a team member as an Operator. The invited person receives an
        email with onboarding instructions to complete KYC verification and
        activate their account.
      tags: [Operators]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, dateOfBirth, phoneNumber, email, address]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                dateOfBirth:
                  type: string
                  example: "05/10/1992"
                  description: "MM/DD/YYYY"
                phoneNumber:
                  type: string
                  pattern: "^\\+1\\d{10}$"
                email:
                  type: string
                  format: email
                address:
                  $ref: '#/components/schemas/Address'
                permissions:
                  $ref: '#/components/schemas/OperatorPermissions'
            example:
              firstName: "Alex"
              lastName: "Johnson"
              dateOfBirth: "05/10/1992"
              phoneNumber: "+12025550106"
              email: "alex.johnson@acmecorp.com"
              address:
                address: "789 Team St"
                city: "Austin"
                state: "TX"
                zipCode: "78703"
                country: "US"
              permissions:
                transferFunds: true
                transferACH: false
                autoPay: true
      responses:
        '201':
          description: Operator invitation sent
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/operator/{operatorId}:
    get:
      operationId: boGetOperator
      summary: Get Operator details
      description: >
        Returns the Operator's profile and current permissions.
      tags: [Operators]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operator details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Operator'
    put:
      operationId: boUpdateOperatorPermissions
      summary: Update Operator permissions
      description: >
        Updates the permissions granted to an Operator. Send the full
        permissions object — any permission not included is revoked.
      tags: [Operators]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  $ref: '#/components/schemas/OperatorPermissions'
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Operator'

  /branches/private/v1/operator/details:
    get:
      operationId: boListOperators
      summary: List Operators
      description: >
        Returns all Operators associated with the authenticated Business Owner's
        account.
      tags: [Operators]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of Operators
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Operator'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  # ─────────────────────────────────────────────
  # Transactions
  # ─────────────────────────────────────────────

  /accounts/private/v1/transactions:
    get:
      operationId: boListTransactions
      summary: List transactions
      description: >
        Returns a paginated transaction history for all of the Business Owner's
        accounts. Transactions represent processed debits and credits (card
        activity, fees). Use `filter[accountId]` to scope to a specific
        account.
      tags: [Transactions]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: filter[accountId]
          in: query
          schema:
            type: string
          description: "Filter to a specific account"
        - name: filter[status]
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            example: "-createdAt"
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        amount:
                          type: string
                          format: decimal
                        status:
                          type: string
                        description:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /accounts/private/v1/transactions/{transactionId}:
    get:
      operationId: boGetTransaction
      summary: Get transaction details
      description: >
        Returns full details for a specific transaction including sender and
        recipient account information.
      tags: [Transactions]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          schema:
            type: string
          description: "Comma-separated list: sender, recipient, requestData"
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      amount:
                        type: string
                        format: decimal
                      status:
                        type: string
                      sender:
                        type: object
                        properties:
                          accountId:
                            type: string
                          userId:
                            type: string
                      recipient:
                        type: object
                        properties:
                          accountId:
                            type: string
                          userId:
                            type: string
                      createdAt:
                        type: string
                        format: date-time

  /accounts/private/v1/transactions/balance-chart:
    get:
      operationId: boGetBalanceChart
      summary: Get balance chart data
      description: >
        Returns time-series balance data for charting. Useful for displaying an
        account balance trend over a selected period.
      tags: [Transactions]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [24hours, 7days, 30days, 12months]
        - name: accountIds
          in: query
          schema:
            type: array
            items:
              type: integer
          description: "Limit chart to specific account IDs"
      responses:
        '200':
          description: Balance chart data points

  # ─────────────────────────────────────────────
  # Account Statements
  # ─────────────────────────────────────────────

  /accounts/private/v1/account/statements:
    get:
      operationId: boListAccountStatements
      summary: List account statements
      description: >
        Returns the available monthly statement files for the Business Owner's
        accounts. Each file can be downloaded via the file endpoint.
      tags: [Account Statements]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Available statements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        fileUid:
                          type: string
                        accountId:
                          type: string
                        monthYear:
                          type: string
                          example: "2024-01"
                        createdAt:
                          type: string
                          format: date-time

  /accounts/private/v1/account/statements/{fileUid}/file:
    get:
      operationId: boDownloadAccountStatement
      summary: Download account statement
      description: >
        Downloads the PDF statement file for the given `fileUid`. Retrieve
        valid file UIDs from `GET /accounts/private/v1/account/statements`.
      tags: [Account Statements]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: fileUid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statement PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ─────────────────────────────────────────────
  # Account Closure
  # ─────────────────────────────────────────────

  /branches/private/v1/delete-profile-otp:
    post:
      operationId: boRequestAccountClosureOTP
      summary: Step 1 — Request account closure OTP
      description: >
        Initiates the account closure process by sending an OTP to the Business
        Owner's verified phone number. The OTP is required to confirm the
        deletion in step 2.


        **Prerequisites before closing:**

        - All accounts must have a zero balance

        - No pending transactions

        - Closure fee (if any) must be satisfiable


        Returns `422` if any blocker prevents closure — check the `code` field
        in the errors array.
      tags: [Account Closure]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: OTP sent to registered phone number
        '409':
          description: Pending transactions block closure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Account closure blocked — check `code` in errors array. Possible
            codes: `PENDING_TRANSACTIONS`, `NON_ZERO_BALANCE`, `INSUFFICIENT_FUNDS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branches/private/v1/delete-profile:
    delete:
      operationId: boConfirmAccountClosure
      summary: Step 2 — Confirm and close account
      description: >
        Permanently closes the Business Owner's account. Requires the OTP from
        step 1. **This action is irreversible.**
      tags: [Account Closure]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  description: "OTP received in step 1"
      responses:
        '200':
          description: Account permanently closed
        '400':
          description: Incorrect OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Closure blockers still present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────
  # Notifications
  # ─────────────────────────────────────────────

  /notifications/private/v1/notifications:
    get:
      operationId: boListNotifications
      summary: List notifications
      description: >
        Returns a paginated list of the Business Owner's notifications, ordered
        newest first.
      tags: [Notifications]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        body:
                          type: string
                        isRead:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time

  /notifications/private/v1/notifications/unread-count:
    get:
      operationId: boGetUnreadNotificationCount
      summary: Get unread notification count
      description: >
        Returns the count of unread notifications — use for badge display in
        the notification bell.
      tags: [Notifications]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: integer

  /notifications/private/v1/notifications/mark-all-read:
    post:
      operationId: boMarkAllNotificationsRead
      summary: Mark all notifications as read
      description: >
        Marks all unread notifications as read and resets the unread count to
        zero.
      tags: [Notifications]
      security:
        - OrgSessionAuth: []
          ClientIdAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: All notifications marked as read
