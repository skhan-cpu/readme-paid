  /branches/private/v1/advisor:
    get:
      security:
        - bearerAuth: []
      tags:
        - Account Manager
      summary: List advisors with business statistics
      description: >
        Retrieves a paginated list of advisors in the TaPP financial platform
        with comprehensive business statistics and filtering capabilities.


        **Access Control**: Only Root Advisors, Super Advisors, and Branch
        Managers can access this endpoint.

        - **Root Advisors**: Can see all advisors across all branches

        - **Super Advisors**: Can see advisors in their scope

        - **Branch Managers**: Can see advisors in their branch


        **Business Statistics**: For each advisor, returns detailed metrics
        including:

        - Number of business owners, accounts, and transactions managed

        - Total business deposits and individual client statistics

        - Aggregate financial data across all client types


        **Features**:

        - **Pagination**: Standard page-based pagination with configurable page
        size

        - **Sorting**: Multiple sort options by status, creation dates, names,
        and IDs

        - **Filtering**: Filter by status, userID, or branchID with multiple
        operators

        - **Search**: Full-text search across advisor names and branch names

        - **Rich Statistics**: Real-time business metrics for each advisor


        **List of possible error codes**:


        | Code                                    | Status |
        Target                  |
        Description                                      |

        |-----------------------------------------|--------|-------------------------|--------------------------------------------------|

        | NO_ACCESS_TO_ACTION                     | 403    |
        common                  | User role not permitted to list
        advisors        |

        | INVALID_REQUEST_PARAMETER              | 400    |
        field                   | Invalid query parameter or pagination
        value     |
      operationId: listAdvisor
      parameters:
        - in: query
          name: sort
          schema:
            type: string
            example: '-status'
            enum:
              - status
              - '-status'
              - userID
              - '-userID'
              - userCreatedAt
              - '-userCreatedAt'
              - userName
              - '-userName'
              - branchID
              - '-branchID'
              - branchCreatedAt
              - '-branchCreatedAt'
          required: false
          description: >-
            Sort field with optional descending prefix (-). Multiple fields can
            be combined.
          example: '?sort=-status,userName'
        - in: query
          name: filter[status]
          schema:
            type: string
            example: active
          required: false
          description: |
            Filter advisors by their current status.

            **Available filters**:
            - `eq:value` - Status must equal the given value
            - `in:value1,value2` - Status must be one of the given values
          example: '?filter[status]=in:active,pending'
        - in: query
          name: filter[userID]
          schema:
            type: string
            format: uuid
            example: 01ed2dc1-f266-4d97-b943-14dab036b4f3
          required: false
          description: Filter by specific advisor user ID (exact match)
          example: '?filter[userID]=01ed2dc1-f266-4d97-b943-14dab036b4f3'
        - in: query
          name: filter[branchID]
          schema:
            type: string
            pattern: ^branch:[A-Za-z0-9]+$
            example: branch:23w10POfw8jTYG51y3zaz43MTM7
          required: false
          description: Filter by specific branch ID in PKSUID format (exact match)
          example: '?filter[branchID]=branch:23w10POfw8jTYG51y3zaz43MTM7'
        - in: query
          name: search[form]
          schema:
            type: string
            example: john smith
          required: false
          description: Full-text search across advisor names and branch names
          example: '?search[form]=john'
        - name: page[limit]
          in: query
          description: Number of records per page (default:10, max:1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
            example: 25
        - name: page[number]
          in: query
          description: Page number (default:1)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 2
      responses:
        '200':
          description: Advisors retrieved successfully with business statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of advisor objects with business statistics
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Advisor user ID
                          example: 01ed2dc1-f266-4d97-b943-14dab036b4f3
                        firstName:
                          type: string
                          description: First name of the advisor
                          example: John
                        lastName:
                          type: string
                          description: Last name of the advisor
                          example: Smith
                        email:
                          type: string
                          format: email
                          description: Advisor's email address
                          example: john.smith@example.com
                        socialSecurityNumber:
                          type: string
                          description: SSN in XXX-XX-XXXX format
                          example: 123-45-6789
                          nullable: true
                        status:
                          type: string
                          enum:
                            - active
                            - blocked
                            - pending
                            - dormant
                          description: Current status of the advisor
                          example: active
                        dateOfBirth:
                          type: string
                          format: date
                          description: Date of birth in YYYY-MM-DD format
                          example: '1985-01-15'
                          nullable: true
                        phoneNumber:
                          type: string
                          description: Phone number
                          example: '+1234567890'
                        internalNotes:
                          type: string
                          description: Internal notes about the advisor
                          nullable: true
                        profileImageID:
                          type: integer
                          description: Profile image identifier
                          nullable: true
                        isEmailConfirmed:
                          type: boolean
                          description: Whether email is confirmed
                          example: true
                        isPhoneNumberConfirmed:
                          type: boolean
                          description: Whether phone number is confirmed
                          example: true
                        address:
