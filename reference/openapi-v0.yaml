      description: >
        Retrieves detailed information about a specific individual customer,
        including personal profile, business information, 

        advisor relationships, KYC status, and financial account data. Access is
        controlled based on user roles and relationships.


        **Access Control:**

        - **Individual Users**: Can only access their own profile (`id` must
        match authenticated user ID)

        - **Root Advisor**: Full access to all individual profiles across all
        branches

        - **Super Advisor/Branch Manager**: Can access individuals within their
        assigned branch only

        - **Advisor**: Can access only individuals they are assigned to advise

        - **Other roles**: Access denied


        **Response Data by Role:**

        - **Individual User**: Returns basic personal profile data only

        - **Supervisory Roles**: Returns comprehensive data including:
          - Complete personal and business profile information
          - Branch and advisor assignment details
          - Current KYC tier and request status
          - Account counts and balances by type
          - KYC validation errors (advisors only)

        **Data Sources:**

        - Personal profile data from tapp-users service

        - Business profile and controlling party information

        - KYC tier status and request history from tapp-kyc service

        - Account counts and balances from tapp-accounts service

        - Branch and advisor relationship data


        **Business Logic:**

        - Real-time data aggregation from multiple external services

        - Role-based data filtering for security and privacy

        - Automatic relationship validation (branch/advisor assignments)

        - Comprehensive error handling for missing or invalid data
