  /users/private/v1/auth/change_password:
    post:
      tags:
        - Password
      summary: Change user password
      description: >
        Allows authenticated users to change their password. Requires the
        current password

        for verification and a new password that meets complexity requirements.


        Password requirements:

        - Minimum 8 characters, maximum 64 characters

        - Must contain at least one special character

        - Must contain at least one number

        - Must contain at least one uppercase letter

        - Must contain at least one lowercase letter


        After successful password change:

        - A notification is sent to the user

        - If user had a NEW_PASSWORD_REQUIRED challenge, it will be cleared
      operationId: ChangePasswordHandler
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        '204':
          description: Password successfully changed - No content returned
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPassword:
                  value:
                    errors:
                      - code: INVALID_PASSWORD
                        title: Invalid password
                        details: Invalid password.
                hashError:
                  value:
                    errors:
                      - code: CANNOT_CREATE_HASH_PASSWORD
                        title: Cannot create hash password
                        details: Can't create hash password.
                updateError:
                  value:
                    errors:
                      - code: CAN_NOT_UPDATE_USER
                        title: Cannot update user
                        details: Can't update user.
        '403':
          description: Forbidden - User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - Validation error or password too weak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  value:
                    errors:
                      previousPassword: previousPassword field is required
                      proposedPassword: proposedPassword field must be at least 8 characters
                      confirmPassword: confirmPassword must match proposedPassword
                passwordTooWeak:
                  value:
                    errors:
                      - code: PASSWORD_TOO_WEAK
                        title: Password too weak
                        details: password too weak
                        target: field
                        source: proposedPassword
  /branches/private/v1/delete-profile-otp:
    post:
      tags:
        - Account Closure
      summary: Send OTP for delete user profile
      operationId: deleteProfileOTP
      parameters:
        - in: header
          schema:
            type: string
          required: true
          name: Authorization
          description: Must be a token string with `Bearer` eg. `Bearer refreshtoken123`
      description: >
        Generate and send an OTP (One-Time Password) for profile deletion
        verification. This endpoint validates that the user is eligible for
        profile deletion and sends an OTP that will be required for the actual
        deletion process.


        **List of possible error codes**:


        | Code                                    | Status |
        Target                                                        |
        Description                                      |

        |-----------------------------------------|--------|---------------------------------------------------------------|--------------------------------------------------|

        | REQUIRED_WITH                           | 400    |
        accountID                                                     | This
        field is required if fee is required                           |

        | VALID_ACCOUNT                           | 400    |
        accountID                                                     |
        Incorrect account for debiting fee                       |

        | ERROR_ACCOUNT_CREATION_PROCESS          | 400    |
        common                                                        | Cannot
        delete profile, accounts are being created                       |

        | OTP_RATE_LIMITED                        | 400    |
        common                                                        | OTP rate
        limited - too many requests                    |

        | FORBIDDEN                               | 403    |
        common                                                        | User is
        not allowed to delete profile                       |


        **Deletion blockers (422 status)**:

        In case something prevents deletion of user (e.g. having balance in
        accounts or pending transactions) returns 422 response with array of
        blockers:


        * *[422]* **POSITIVE_BALANCE** - User has positive balance in accounts

        * *[422]* **PENDING_TRANSACTIONS** - User has pending transactions  

        * *[422]* **INSUFFICIENT_FUNDS_FOR_FEE** - Insufficient funds to pay
        closure fee
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: integer
                  description: >-
                    Required if deletion fee is greater than zero. Account to
                    debit the closure fee from.
                  example: 12345
      responses:
        '200':
          description: Ok
        '400':
          description: Request parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                Invalid parameter:
                  value:
                    errors:
                      - title: reason
                        code: INVALID_REQUEST_PARAMETER
                        target: common
                        source: filter
        '401':
          description: Authentication error
        '403':
          description: Authorization error
  /branches/private/v1/delete-profile:
    delete:
      tags:
        - Account Closure
      summary: Confirm profile deletion
      operationId: deleteProfile
      description: >
        Permanently deletes the authenticated user's profile and closes all
        associated accounts.

        Requires the OTP sent by `POST /branches/private/v1/delete-profile-otp`.


        This action is irreversible. Ensure the user has withdrawn all funds and
        has no pending

        transactions before calling this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  description: The one-time password received via SMS.
                  example: '123456'
      responses:
        '200':
          description: Profile deleted successfully.
        '400':
          description: Invalid or expired OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: Authentication error.
        '403':
          description: Authorization error.
        '422':
          description: Deletion blocked — user still has balance or pending transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /notifications/private/v1/notifications/mark-all-read:
    post:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: >
        Marks all of the authenticated user's notifications as read in a single
        call.

        Use this after displaying the notification list to clear the unread
        badge.
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read successfully.
        '401':
          description: Unauthorized — missing or invalid access token.
        '403':
          description: Forbidden — token does not have sufficient permissions.
  /kyc/private/v1/requests/last:
    get:
      tags:
        - KYC
      summary: Get latest KYC request
      description: >
        Returns the most recent KYC request submitted by the authenticated user.

        Use this to display the user's current KYC review status and whether
        document

        verification is required (`isRequiredDocVer`).


        **KYC request statuses**: `pending`, `approved`, `rejected`,
        `incomplete`
      operationId: getLatestKycRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest KYC request returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KycRequest'
              example:
                data:
                  id: 42
                  status: pending
                  isView: false
                  tier:
                    id: 1
                    level: 1
                    name: Basic
                  createdAt: '2024-03-01T10:00:00Z'
                  updatedAt: '2024-03-01T10:05:00Z'
                  userId: 0311fb47-e43d-4e84-9a83-27db1a40675e
                  isRequiredDocVer: false
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Pass the JWT token in the `Authorization` header:

        ```

        Authorization: Bearer <token>

        ```

        During onboarding (steps 4–9), use the **temporary access token**
        returned in the

        `403` response from `/branches/public/v1/individual/invites/accept`.

        After step 10, use the **full access token** from
        `/users/private/v1/limited/token-exchange`.
  schemas:
    ResponseError:
      description: Standard error envelope used by the `tapp-branches` service.
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: Human-readable error summary.
                example: Invitation does not exist
              code:
                type: string
                description: Machine-readable error code.
                example: INVITATION_DOES_NOT_EXIST
              target:
                type: string
                description: >-
                  `common` for general errors, or the field path for field-level
                  errors.
                example: common
              source:
                type: string
                description: >-
                  The request field that caused the error (when `target` is a
                  field path).
                example: dateOfBirth
              statusCode:
                type: integer
                description: HTTP status code (present in some 403 responses).
                example: 403
              meta:
                type: object
                description: >-
                  Additional context (e.g., `fields` array listing required
                  onboarding actions).
                example:
                  fields:
                    - phoneNumber
                    - kyc
    TemporaryAccess:
      description: >
        Response returned when account creation succeeds but additional
        onboarding steps are

        required. Extract `data.temporaryAccessToken` and use it for all
        subsequent `/limited/`

        endpoint calls.
      type: object
      properties:
        data:
          type: object
          properties:
            temporaryAccessToken:
              type: string
              description: Short-lived token granting access to `/limited/` endpoints only.
              example: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9...
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: required additional actions
              target:
                type: string
                example: common
              title:
                type: string
                example: Forbidden
              statusCode:
                type: integer
                example: 403
              meta:
                type: object
                properties:
                  fields:
                    type: array
                    description: List of onboarding steps still required.
                    items:
                      type: string
                      enum:
                        - phoneNumber
                        - kyc
                        - kyb
                    example:
                      - phoneNumber
                      - kyc
    ErrorResponse:
      description: Standard error envelope used by the `tapp-users` service.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
    ErrorItem:
      type: object
      properties:
        title:
          type: string
          description: Human-readable error summary.
          example: Invalid confirmation code
        details:
          type: string
          description: Additional context about the error.
          example: The provided code does not match.
        code:
          type: string
          description: Machine-readable error code.
          example: INVALID_CONFIRMATION_CODE
        source:
          type: string
          description: >-
            The request field that caused the error (when `target` is
            `"field"`).
          example: code
        target:
          type: string
          description: '`common` for general errors, `field` for field-level errors.'
          example: field
        meta:
          type: object
          nullable: true
          description: Additional structured context (e.g., rate limit info).
          example: null
    SecurityQuestion:
      description: A security question from the active pool.
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Numeric ID to reference when submitting answers.
          example: 1
        code:
          type: string
          description: >-
            Stable string identifier for the question. Does not change across
            deployments.
          example: BIRTH_CITY
        text:
          type: string
          description: Question text to display to the user.
          example: What city were you born in?
        displayOrder:
          type: integer
          description: Suggested display order for the UI.
          example: 1
    SecurityAnswerInput:
      description: A single (questionId, answer) pair.
      type: object
      required:
        - questionId
        - answer
      properties:
        questionId:
          type: integer
          format: int64
          description: The `id` of the security question being answered.
          example: 1
        answer:
          type: string
          maxLength: 200
          description: The user's answer. Must not be blank, max 200 characters.
          example: Seattle
    SecurityAnswerStatus:
      description: Completion status of the security questions onboarding step.
      type: object
      properties:
        completed:
          type: boolean
          description: '`true` if the user has submitted all required answers.'
          example: false
        count:
          type: integer
          description: Number of answers already stored.
          example: 0
        required:
          type: integer
          description: Total number of answers required (always 3).
          example: 3
        remainingQuestions:
          type: array
          description: Questions not yet answered. Empty array when `completed` is `true`.
          items:
            $ref: '#/components/schemas/SecurityQuestion'
    IndividualSignupParams:
      description: Complete KYC payload for individual user signup (step 9).
      type: object
      required:
        - dateOfBirth
        - socialSecurityNumber
        - usCitizenshipStatus
        - address
        - w9
        - employment
        - transferActivity
      properties:
        middleName:
          type: string
          description: Optional middle name.
          example: Michael
        dateOfBirth:
          type: string
          format: date
          description: Date of birth in `YYYY-MM-DD` format. Must be a past date.
          example: '1990-03-20'
        socialSecurityNumber:
          type: string
          description: Social Security Number in `XXX-XX-XXXX` format.
          pattern: ^\d{3}-\d{2}-\d{4}$
          example: 987-65-4321
        usCitizenshipStatus:
          type: string
          description: >-
            US citizenship status (e.g., `Citizen`, `PermanentResident`,
            `NonResident`).
          example: Citizen
        address:
          $ref: '#/components/schemas/SignupAddress'
        mailingAddress:
          $ref: '#/components/schemas/SignupAddress'
          description: Optional mailing address if different from primary address.
        w9:
          type: object
          description: >-
            W9 tax certification data. Display the terms from `/w9/terms` before
            collecting this.
          required:
            - isSubjectToBackupWithholding
            - accepted
            - timestamp
          properties:
            isSubjectToBackupWithholding:
              type: boolean
              description: Whether the user is subject to backup withholding.
              example: false
            accepted:
              type: boolean
              description: Must be `true` — indicates user accepted the W9 certification.
              example: true
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 timestamp of when the user accepted the W9 terms.
              example: '2017-07-21T17:32:28Z'
        employment:
          $ref: '#/components/schemas/SignupEmployment'
        transferActivity:
          $ref: '#/components/schemas/SignupTransferActivity'
    SignupAddress:
      description: Physical or mailing address.
      type: object
      required:
        - address
        - city
        - state
        - zipCode
        - country
      properties:
        address:
          type: string
          description: Street address line 1.
          example: 789 Pine Street
        city:
          type: string
          description: City name (letters, spaces, and hyphens only).
          example: Seattle
        state:
          type: string
          description: Two-letter US state code.
          example: WA
        zipCode:
          type: string
          description: Postal/ZIP code.
          example: '98101'
        country:
          type: string
          description: Two-letter ISO 3166-1 alpha-2 country code.
          example: US
    SignupEmployment:
      description: Current employment details and income sources.
      type: object
      required:
        - isCurrentlyEmployed
        - annualIncome
      properties:
        isCurrentlyEmployed:
          type: boolean
          description: Whether the user is currently employed.
          example: true
        occupation:
          type: string
          description: Job title or occupation.
          example: Marketing Manager
        employer:
          type: string
          description: Current employer name.
          example: Digital Solutions Inc
        annualIncome:
          type: string
          description: Total annual income as a decimal string (e.g., `"65000.00"`).
          example: '65000.00'
        employmentStartDate:
          type: string
          format: date
          description: Employment start date in `YYYY-MM-DD` format.
          example: '2018-09-01'
        incomeSources:
          type: array
          description: Breakdown of income sources.
          items:
            type: object
            required:
              - name
              - amount
              - frequency
            properties:
              name:
                type: string
                description: Name of the income source.
                example: Base Salary
              amount:
                type: string
                description: Amount as a decimal string.
                example: '4500.00'
              frequency:
                type: string
                description: How often this income is received.
                enum:
                  - Weekly
                  - BiWeekly
                  - Monthly
                  - Quarterly
                  - Annually
                example: Monthly
    SignupTransferActivity:
      description: Expected financial transaction activity for compliance purposes.
      type: object
      properties:
        internationalTransferExpected:
          type: boolean
          description: Whether the user expects to make international wire transfers.
          example: true
        internationalTransferFrequency:
          type: string
          description: How often international transfers are expected.
          enum:
            - OncePerMonth
            - OnceEveryFewMonths
            - OncePerYear
          example: OnceEveryFewMonths
        internationalTransferAmountRange:
          type: string
          description: Expected dollar amount range per international transfer.
          enum:
            - from_0_to_9999
            - from_10000_to_49999
            - from_50000_to_99999
            - from_100000_and_above
          example: from_10000_to_49999
        internationalTransferCountries:
          type: array
          description: ISO 3166-1 alpha-3 country codes for expected transfer destinations.
          items:
            type: string
          example:
            - CAN
            - MEX
        cryptocurrencyTransactionExpected:
          type: boolean
          description: Whether the user expects to make cryptocurrency transactions.
          example: false
        cryptocurrencyTransactionFrequency:
          type: string
          nullable: true
          description: >-
            How often cryptocurrency transactions are expected. `null` if not
            expected.
          example: null
        cryptocurrencyTransactionAmountRange:
          type: string
          nullable: true
          description: >-
            Expected dollar amount range per crypto transaction. `null` if not
            expected.
          example: null
        cashTransactionExpected:
          type: boolean
          description: Whether the user expects to make large cash transactions.
          example: true
        cashTransactionFrequency:
          type: string
          description: How often cash transactions are expected.
          enum:
            - OncePerMonth
            - OnceEveryFewMonths
            - OncePerYear
          example: OncePerMonth
        cashTransactionAmountRange:
          type: string
          description: Expected dollar amount range per cash transaction.
          enum:
            - from_0_to_9999
            - from_10000_to_49999
            - from_50000_to_99999
            - from_100000_and_above
          example: from_0_to_9999
    User:
      description: Full user profile returned after a successful token exchange.
      type: object
      properties:
        uid:
          type: string
          description: Unique user identifier (UUID).
          example: 0311fb47-e43d-4e84-9a83-27db1a40675e
        email:
          type: string
          example: individual@example.com
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        phoneNumber:
          type: string
          example: '+12025551234'
        roleName:
          type: string
          example: individual
        status:
          type: string
          description: Account status.
          enum:
            - active
            - pending
            - blocked
          example: active
        isPhoneConfirmed:
          type: boolean
          example: true
        isEmailConfirmed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2024-03-01T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-01T10:05:00Z'
    SuccessLogin:
      description: Successful authentication response containing access and refresh tokens.
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: >-
                JWT access token. Valid for 30 minutes. Use in the Authorization
                header: Bearer <token>.
              example: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken:
              type: string
              description: >-
                Opaque refresh token. Valid for 30 days. Use to obtain a new
                access token.
              example: LUFrryIYVKo4SOQUdlzp6-BMWLn34YwW...
            challengeName:
              type: string
              nullable: true
              description: >
                Set when an additional action is required.
                `new_password_required` means the user must

                change their password before proceeding.
              example: null
    Individual:
      description: An individual user's profile and associated relationship data.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique individual user identifier.
          example: 01ed2dc1-f266-4d97-b943-14dab036b4f3
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        status:
          type: string
          enum:
            - active
            - pending
            - blocked
          example: active
        phoneNumber:
          type: string
          description: E.164 formatted phone number.
          example: '+12025551234'
        isEmailConfirmed:
          type: boolean
          example: true
        isPhoneNumberConfirmed:
          type: boolean
          example: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: '1990-03-20'
        socialSecurityNumber:
          type: string
          nullable: true
          description: Masked SSN for display.
          example: '***-**-4321'
        address:
          type: object
          nullable: true
          properties:
            addr:
              type: string
              example: 123 Main Street
            city:
              type: string
              example: New York
            state:
              type: string
              example: NY
            zipCode:
              type: string
              example: '10001'
            country:
              type: string
              example: US
        branch:
          type: object
          nullable: true
          description: The branch this individual belongs to.
          properties:
            id:
              type: string
              example: branch:23w10POfw8jTYG51y3zaz43MTM7
            name:
              type: string
              example: Main Street Branch
        advisor:
          type: object
          nullable: true
          description: The advisor assigned to this individual.
          properties:
            id:
              type: string
              example: advisor-uuid
            firstName:
              type: string
              example: John
            lastName:
              type: string
              example: Smith
            email:
              type: string
              example: advisor@example.com
    AccountsCount:
      description: Count of accounts grouped by type.
      type: object
      properties:
        count:
          type: integer
          description: Number of accounts of this type.
          example: 2
        typeID:
          type: string
          description: Account type identifier.
          example: type_checking
        typeName:
          type: string
          description: Human-readable account type name.
          example: Checking
    AccountsBalance:
      description: Total balance for accounts of a given type.
      type: object
      properties:
        amount:
          type: string
          description: Total balance amount.
          example: '10500.50'
        currencyCode:
          type: string
          example: USD
        typeID:
          type: string
          description: Account type identifier.
          example: type_checking
        typeName:
          type: string
          example: Checking
    Pagination:
      description: Pagination metadata returned in list responses.
      type: object
      properties:
        totalRecord:
          type: integer
          description: Total number of matching records.
          example: 150
        totalPage:
          type: integer
          description: Total number of pages.
          example: 8
        offset:
          type: integer
          description: Number of records skipped (external-accounts service).
          example: 20
        limit:
          type: integer
          description: Maximum records per page.
          example: 20
        pageNumber:
          type: integer
          description: Current page number (1-based, external-accounts service).
          example: 2
        currentPage:
          type: integer
          description: Current page number (1-based, accounts service).
          example: 2
    CollectionLinks:
      description: >-
        Cursor-style navigation links for paginated collections (accounts
        service).
      type: object
      properties:
        next:
          type: string
          description: URL to the next page. Null when on the last page.
          nullable: true
          example: /accounts/private/v1/accounts?page[number]=3&page[size]=20
        prev:
          type: string
          description: URL to the previous page. Null when on the first page.
          nullable: true
          example: /accounts/private/v1/accounts?page[number]=1&page[size]=20
        first:
          type: string
          description: URL to the first page.
          nullable: true
        last:
          type: string
          description: URL to the last page.
          nullable: true
        totalRecord:
          type: integer
          description: Total number of records across all pages.
          example: 47
    AmountItem:
      description: A monetary amount with its currency code.
      type: object
      properties:
        amount:
          type: string
          description: Decimal amount string.
          example: '1250.00'
        currencyCode:
          type: string
          description: ISO 4217 currency code.
          example: USD
    BalanceWithPendingResponse:
      description: Account balance including pending incoming and outgoing amounts.
      type: object
      properties:
        balance:
          $ref: '#/components/schemas/AmountItem'
        pendingIncoming:
          $ref: '#/components/schemas/AmountItem'
        pendingOutgoing:
          $ref: '#/components/schemas/AmountItem'
        filters:
          type: object
          description: Any active filters applied to the balance calculation.
          nullable: true
    ShortAccount:
      description: Minimal account reference used inside transaction objects.
      type: object
      properties:
        number:
          type: string
          description: Masked account number.
          example: '****5678'
        currencyCode:
          type: string
          example: USD
        userId:
          type: string
          format: uuid
          example: 0311fb47-e43d-4e84-9a83-27db1a40675e
        typeId:
          type: integer
          example: 1
        description:
          type: string
          example: Checking
    FullAccountType:
      description: >-
        Detailed account type definition including fee and interest rate
        configuration.
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Individual Checking
        currencyCode:
          type: string
          example: USD
        interestRate:
          type: string
          nullable: true
          example: '0.50'
        feeAmount:
          type: string
          nullable: true
          example: '5.00'
    FullAccount:
      description: Complete account object returned by the accounts service.
      type: object
      properties:
        id:
          type: integer
          example: 1001
        number:
          type: string
          description: Internal account number.
          example: ACC-0001-20240301
        name:
          type: string
          example: Jane's Checking
        type:
          $ref: '#/components/schemas/FullAccountType'
        typeId:
          type: integer
          example: 1
        userId:
          type: string
          format: uuid
          example: 0311fb47-e43d-4e84-9a83-27db1a40675e
        description:
          type: string
          example: Primary checking account
        isActive:
          type: boolean
          example: true
        allowWithdrawals:
          type: boolean
          example: true
        allowDeposits:
          type: boolean
          example: true
        initialBalance:
          type: string
          example: '0.00'
        maturityDate:
          type: string
          format: date
          nullable: true
          example: null
        payoutDay:
          type: integer
          nullable: true
          example: null
        interestAccountId:
          type: integer
          nullable: true
          example: null
        availableAmount:
          type: string
          description: Available balance for new transactions.
          example: '1245.50'
        balance:
          type: string
          description: Current posted balance.
          example: '1245.50'
        createdAt:
          type: string
          format: date-time
          example: '2024-03-01T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-01T10:05:00Z'
    UserShort:
      description: Brief user reference embedded in transaction objects.
      type: object
      properties:
        uid:
          type: string
          format: uuid
          example: 0311fb47-e43d-4e84-9a83-27db1a40675e
        roleName:
          type: string
          example: individual
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        userName:
          type: string
          example: jane.doe
    TransactionView:
      description: Full transaction detail for a single account transaction.
      type: object
      properties:
        id:
          type: integer
          example: 9001
        amount:
          type: string
          description: Transaction amount (positive = credit, negative = debit).
          example: '-100.00'
        balanceSnapshot:
          type: string
          description: Account balance at the time of the transaction.
          example: '1145.50'
        createdAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:05Z'
        statusChangedAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:05Z'
        description:
          type: string
          example: Transfer to savings
        purpose:
          type: string
          description: Internal purpose code.
          example: tba_transfer
        requestId:
          type: integer
          description: ID of the originating request.
          example: 500
        requestSubject:
          type: string
          example: Transfer
        showRequestId:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - pending
            - executed
            - cancelled
          example: executed
        type:
          type: string
          description: Transaction type (debit or credit).
          example: debit
        sender:
          $ref: '#/components/schemas/UserShort'
        recipient:
          $ref: '#/components/schemas/UserShort'
    ListTransaction:
      description: Transaction summary used in paginated transaction lists.
      type: object
      properties:
        id:
          type: integer
          example: 9001
        amount:
          type: string
          example: '-100.00'
        account:
          $ref: '#/components/schemas/ShortAccount'
        balanceSnapshot:
          type: string
          example: '1145.50'
        createdAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:05Z'
        statusChangedAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:05Z'
        description:
          type: string
          example: Transfer to savings
        purpose:
          type: string
          example: tba_transfer
        requestId:
          type: integer
          example: 500
        requestSubject:
          type: string
          example: Transfer
        showRequestId:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - pending
            - executed
            - cancelled
          example: executed
        type:
          type: string
          example: debit
        initiator:
          $ref: '#/components/schemas/UserShort'
        targetAccount:
          type: object
          properties:
            number:
              type: string
              example: ACC-0002-20240301
        isAutoPayment:
          type: boolean
          example: false
        card:
          type: object
          nullable: true
          properties:
            number:
              type: string
            name:
              type: string
            brand:
              type: string
    CreateTBARequest:
      description: Request body to initiate a transfer between two internal accounts.
      type: object
      required:
        - accountIdFrom
        - accountIdTo
        - outgoingAmount
      properties:
        accountIdFrom:
          type: integer
          description: ID of the source account.
          example: 1001
        accountIdTo:
          type: integer
          description: ID of the destination account.
          example: 1002
        outgoingAmount:
          type: string
          description: Amount to deduct from the source account (positive decimal string).
          example: '100.00'
        incomingAmount:
          type: string
          description: >-
            Amount to credit to the destination (used for cross-currency; leave
            blank for same-currency transfers).
          example: '100.00'
        description:
          type: string
          description: Optional transfer note.
          example: Monthly savings transfer
    CreateTBARequestPreview:
      description: Request body to preview a TBA transfer before submitting it.
      type: object
      required:
        - accountIdFrom
        - accountIdTo
        - outgoingAmount
      properties:
        accountIdFrom:
          type: integer
          example: 1001
        accountIdTo:
          type: integer
          example: 1002
        outgoingAmount:
          type: string
          example: '100.00'
    TBARequest:
      description: A Transfer Between Accounts (TBA) request record.
      type: object
      properties:
        id:
          type: integer
          example: 500
        amount:
          type: string
          description: Transfer amount.
          example: '100.00'
        baseCurrencyCode:
          type: string
          example: USD
        referenceCurrencyCode:
          type: string
          example: USD
        rate:
          type: string
          description: Exchange rate (1.000000 for same-currency transfers).
          example: '1.000000'
        cancellationReason:
          type: string
          nullable: true
          example: null
        description:
          type: string
          example: Monthly savings transfer
        isInitiatedBySystem:
          type: boolean
          example: false
        status:
          type: string
          enum:
            - pending
            - executed
            - cancelled
          example: pending
        statusChangedAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:05Z'
        subject:
          type: string
          example: Transfer
        userId:
          type: string
          format: uuid
          example: 0311fb47-e43d-4e84-9a83-27db1a40675e
        createdAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:05Z'
    TBARequestPreviewDetails:
      description: Line-item breakdown of a TBA transfer preview (fees, principal, etc.).
      type: array
      items:
        type: object
        properties:
          purpose:
            type: string
            description: Purpose code for this line item.
            example: fee_transfer_default
          currencyCode:
            type: string
            example: USD
          amount:
            type: string
            description: Positive = fee charged; negative = deducted from principal.
            example: '-8.95'
    TBARequestPreview:
      description: >-
        Preview result for a TBA transfer showing incoming amount and fee
        breakdown.
      type: object
      properties:
        incomingAmount:
          type: string
          description: Amount that will be credited to the destination account after fees.
          example: '91.05'
        details:
          $ref: '#/components/schemas/TBARequestPreviewDetails'
    OWTRequestPreview:
      description: >-
        Preview result for an outward wire/EXT transfer showing total outgoing
        amount and fee breakdown.
      type: object
      properties:
        totalOutgoingAmount:
          type: string
          description: >-
            Total amount that will be debited from the source account (principal
            + fees).
          example: '108.95'
        details:
          $ref: '#/components/schemas/TBARequestPreviewDetails'
    CreateEXTRequest:
      description: >
        Request body to initiate an ACH transfer between an internal account and
        a linked

        external bank account. `fromAccountId` can be either an internal account
        ID

        (integer) or an external account ID (PKSUID string).
      type: object
      required:
        - fromAccountId
        - toAccountId
        - amount
      properties:
        fromAccountId:
          type: string
          description: Source account ID — internal integer ID or external PKSUID.
          example: '1001'
        toAccountId:
          type: string
          description: Destination account ID — internal integer ID or external PKSUID.
          example: ext_acc_12345
        amount:
          type: string
          description: Transfer amount (positive decimal string).
          example: '250.00'
        description:
          type: string
          description: Optional transfer note.
          example: ACH pull from external account
    CreateEXTRequestPreview:
      description: Request body to preview an EXT (ACH) transfer before submitting it.
      type: object
      required:
        - fromAccountId
        - toAccountId
        - amount
      properties:
        fromAccountId:
          type: string
          example: '1001'
        toAccountId:
          type: string
          example: ext_acc_12345
        amount:
          type: string
          example: '250.00'
    Account:
      description: An external bank account linked via BaaS (e.g., Plaid).
      type: object
      required:
        - id
        - type
        - number
        - routingNumber
        - accountName
        - ownerName
        - bankName
      properties:
        id:
          type: string
          description: Unique external account identifier (PKSUID).
          example: ext_acc_12345
        type:
          type: string
          description: Type of bank account.
          enum:
            - checking
            - savings
            - credit_card
            - loan
            - investment
          example: checking
        number:
          type: string
          description: Masked account number — last 4 digits are visible.
          pattern: ^\*{4,}\d{4}$
          example: '****1234'
        routingNumber:
          type: string
          description: 9-digit ABA routing number.
          pattern: ^\d{9}$
          example: '021000021'
        balance:
          type: string
          description: Current balance in USD.
          example: '1500.00'
        availableAmount:
          type: string
          description: Available amount for transactions in USD.
          example: '1450.00'
        accountName:
          type: string
          description: Account name as registered with the bank.
          example: Business Checking
        ownerName:
          type: string
          description: Name of the account owner.
          example: Jane Doe
        bankName:
          type: string
          description: Name of the financial institution.
          example: Chase Bank
        bankLogoURL:
          type: string
          format: uri
          nullable: true
          description: URL to the bank's logo image.
          example: https://logos.bank.com/chase.png
        businessProfile:
          $ref: '#/components/schemas/BusinessProfile'
        status:
          type: string
          enum:
            - active
            - inactive
            - pending
            - error
          description: Current connection status.
          example: active
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
    BusinessProfile:
      description: Business profile information attached to a business external account.
      type: object
      properties:
        name:
          type: string
          description: Business name.
          example: ABC Corporation
        id:
          type: string
          description: Unique identifier for the business profile.
          example: bp_12345
        type:
          type: string
          description: Business entity type.
          enum:
            - corporation
            - llc
            - partnership
            - sole_proprietorship
            - other
          example: corporation
        taxId:
          type: string
          description: Business tax ID (masked for display).
          example: '**-*******'
        address:
          type: object
          properties:
            street:
              type: string
              example: 123 Business Ave
            city:
              type: string
              example: New York
            state:
              type: string
              example: NY
            zipCode:
              type: string
              example: '10001'
    Notification:
      description: A single user notification.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique notification identifier.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        uid:
          type: string
          format: uuid
          description: User ID this notification belongs to.
          example: 0311fb47-e43d-4e84-9a83-27db1a40675e
        type:
          type: string
          description: Notification type code.
          example: TRANSACTION_EXECUTED
        data:
          type: object
          description: Notification payload — fields vary by `type`.
          properties:
            Amount:
              type: string
              description: Transaction amount (if applicable).
              example: '100.00'
            AccountNumber:
              type: string
              description: Account number involved (if applicable).
              example: ACC-0001-20240301
            AvailableBalance:
              type: string
              description: Account balance after the event (if applicable).
              example: '1145.50'
        isRead:
          type: boolean
          description: '`true` if the notification has been read.'
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-15T14:22:05Z'
    KycTier:
      description: A KYC tier level (brief reference).
      type: object
      properties:
        id:
          type: integer
          example: 1
        level:
          type: integer
          description: Numeric tier level. Higher = more verified.
          example: 1
        name:
          type: string
          example: Basic
    KycRequest:
      description: A user's KYC verification request and its current status.
      type: object
      properties:
        id:
          type: integer
          example: 42
        status:
          type: string
          description: Review status of the KYC request.
          enum:
            - pending
            - approved
            - rejected
            - incomplete
          example: pending
        isView:
          type: boolean
          description: '`true` if the user has viewed this result.'
          example: false
        tier:
          $ref: '#/components/schemas/KycTier'
        createdAt:
          type: string
          format: date-time
          example: '2024-03-01T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-01T10:05:00Z'
        userId:
          type: string
          format: uuid
          example: 0311fb47-e43d-4e84-9a83-27db1a40675e
        isRequiredDocVer:
          type: boolean
          description: '`true` means the user must initiate document verification.'
          example: false
    KycRequirementValue:
      description: A single value attached to a KYC requirement.
      type: object
      properties:
        id:
          type: integer
          example: 101
        value:
          type: string
          example: 123 Main St
        type:
          type: string
          example: text
    KycRequirement:
      description: >-
        A KYC requirement within a tier (e.g., identity check, address
        verification).
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Identity verification
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - incomplete
          example: pending
        values:
          type: array
          items:
            $ref: '#/components/schemas/KycRequirementValue'
    KycLimitation:
      description: A limitation associated with a KYC tier (e.g., transaction limits).
      type: object
      properties:
        name:
          type: string
          description: Limitation name.
          example: daily_limit
        value:
          type: string
          description: Limitation value (may be a decimal or a count).
          example: '500.00'
    KycTierForUser:
      description: Full KYC tier with requirements and limitations visible to the user.
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Basic
        level:
          type: integer
          example: 1
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/KycRequirement'
        limitations:
          type: array
          items:
            $ref: '#/components/schemas/KycLimitation'
    KycCurrentTier:
      description: The authenticated user's current KYC tier with its active limitations.
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Basic
        level:
          type: integer
          example: 1
        limitations:
          type: array
          items:
            $ref: '#/components/schemas/KycLimitation'
    CreateKycRequest:
      description: Request body to create a new KYC tier upgrade request.
      type: object
      required:
        - tierId
      properties:
        tierId:
          type: integer
          format: int64
          description: ID of the KYC tier to apply for.
          example: 2
    AccountsErrorItem:
      description: A single error item in an accounts-service error response.
      type: object
      properties:
        title:
          type: string
          description: Human-readable error summary.
          example: Bad Request
        details:
          type: string
          description: Additional context about the error.
          example: accountIdFrom is required
        code:
          type: string
          description: Machine-readable error code.
          example: REQUIRED
        source:
          type: string
          description: Field name if target is `field`.
          example: accountIdFrom
        target:
          type: string
          enum:
            - field
            - common
          description: '`field` for field-level errors, `common` for general errors.'
          example: field
        meta:
          type: object
          nullable: true
          description: Additional structured metadata.
    BadRequestResponse:
      description: 400 Bad Request — one or more validation errors.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AccountsErrorItem'
    ForbiddenResponse:
      description: 403 Forbidden — the caller does not have permission.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AccountsErrorItem'
    NotFoundResponse:
      description: 404 Not Found — the requested resource does not exist.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AccountsErrorItem'
    UnprocessableEntityResponse:
      description: 422 Unprocessable Entity — business rule or validation failure.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AccountsErrorItem'
    UnauthorizedResponse:
      description: 401 Unauthorized — authentication is required.
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                example: Unauthorized
              detail:
                type: string
                example: Authentication required
              code:
                type: string
                example: AUTH_REQUIRED
    ConflictResponse:
      description: >-
        409 Conflict — the operation cannot be completed due to a state
        conflict.
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                example: Conflict
              detail:
                type: string
                example: Account has pending transactions
              code:
                type: string
                example: ACCOUNT_HAS_PENDING_TRANSACTIONS
    InternalServerErrorResponse:
      description: 500 Internal Server Error — an unexpected server-side error occurred.
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                example: Internal Server Error
              detail:
                type: string
                example: An unexpected error occurred
              code:
                type: string
                example: INTERNAL_ERROR
  requestBodies:
    SubmitSecurityAnswers:
      description: >
        Exactly three (questionId, answer) pairs. Use the `id` values from the

        `/security-questions` list response. Each `questionId` must be unique
        within the request.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - answers
            properties:
              answers:
                type: array
                minItems: 3
                maxItems: 3
                items:
                  $ref: '#/components/schemas/SecurityAnswerInput'
          examples:
            Three distinct answers:
              value:
                answers:
                  - questionId: 1
                    answer: Seattle
                  - questionId: 5
                    answer: Buddy
                  - questionId: 9
                    answer: Blue
    ChangePassword:
      description: >
        Request body for changing the authenticated user's password.

        Requires the current password for verification plus the new password
        (confirmed twice).
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - previousPassword
                  - proposedPassword
                  - confirmPassword
                properties:
                  previousPassword:
                    type: string
                    description: The user's current password.
                    example: OldPassword123!
                  proposedPassword:
                    type: string
                    description: >
                      New password. Must be 8–64 characters and contain at least
                      one uppercase

                      letter, one lowercase letter, one digit, and one special
                      character.
                    minLength: 8
                    maxLength: 64
                    example: NewPassword#2024
                  confirmPassword:
                    type: string
                    description: Must match `proposedPassword` exactly.
                    example: NewPassword#2024
    LogIn:
      description: >-
        Sign in request body — supports email, phone (E.164), or username as
        login.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - login
              - password
            properties:
              login:
                type: string
                description: Email address, E.164 phone number, or username.
                minLength: 3
                maxLength: 255
                example: jane.doe@example.com
              password:
                type: string
                description: Account password.
                minLength: 1
                example: SecurePassword123!
              roles:
                type: array
                description: >-
                  Optional role restriction. If provided, the user must have one
                  of these roles.
                items:
                  type: string
                  enum:
                    - root
                    - admin
                    - client
                    - advisor
                    - business_owner
                    - individual
                example:
                  - individual
  examples:
    SuccessfulLogin:
      summary: Successful Login
      value:
        status: 200
        data:
          accessToken: >-
            eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1aWQiOiIwMzExZmI0Ny1lNDNkLTRlODQtOWE4My0yN2RiMWE0MDY3NWUiLCJyb2xlTmFtZSI6ImluZGl2aWR1YWwifQ.signature
          refreshToken: LUFrryIYVKo4SOQUdlzp6-BMWLn34YwW_jAfMNiJq20u8btCYBoLnmD63onRneKV
          challengeName: null
    AdminData:
      summary: Admin user profile
      value:
        status: 200
        data:
          uid: stkqkfgskshtvskk
          email: admin@velmie.com
          firstName: bank-admin
          lastName: bank-admin
          roleName: root
          status: active
          isPhoneConfirmed: false
    BuyerData:
      summary: Individual user profile
      value:
        status: 200
        data:
          uid: 0311fb47-e43d-4e84-9a83-27db1a40675e
          email: jane.doe@example.com
          firstName: Jane
          lastName: Doe
          phoneNumber: '+12025551234'
          roleName: individual
          status: active
          isPhoneConfirmed: true
          isEmailConfirmed: false
          createdAt: '2024-03-01T10:00:00Z'
          updatedAt: '2024-03-01T10:05:00Z'
    AccessTokenNotFoundError:
      summary: Access token not found
      value:
        errors:
          - title: Access token not found
            details: ''
            code: ACCESS_TOKEN_NOT_FOUND
            source: null
            target: common
            meta: null
    AccessTokenIsInvalidError:
      summary: Access token is invalid
      value:
        errors:
          - title: Access token is invalid
            details: ''
            code: ACCESS_TOKEN_INVALID
            source: null
            target: common
            meta: null
  parameters:
    PageSize:
      name: page[size]
      in: query
      description: Number of records to return per page. Default is 20.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      example: 20
    PageNumber:
      name: page[number]
      in: query
      description: Page number to return (1-based). Default is 1.
      schema:
        type: integer
        default: 1
        minimum: 1
      example: 1
    StatusEq:
      name: filter[status:eq]
      in: query
      description: Filter by exact status match.
      schema:
        type: string
      example: pending
    StatusNeq:
      name: filter[status:neq]
      in: query
      description: Filter by status NOT equal to the given value.
      schema:
        type: string
      example: cancelled
    StatusIn:
      name: filter[status:in]
      in: query
      description: Filter by status being in the given comma-separated list.
      schema:
        type: string
      example: pending,executed
    StatusNin:
      name: filter[status:nin]
      in: query
      description: Filter by status NOT in the given comma-separated list.
      schema:
        type: string
      example: cancelled
    Status:
      name: filter[status]
      in: query
      description: Filter by status (simple equality shorthand).
      schema:
        type: string
      example: executed
