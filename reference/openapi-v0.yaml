                        numberOfAccounts:
                          type: integer
                          description: Total accounts (business + individual)
                          example: 55
                        numberOfTransactions:
                          type: integer
                          description: Total transactions (business + individual)
                          example: 1550
                        totalDeposits:
                          type: string
                          description: Total deposits/balances as string
                          example: '225000.75'
                  pagination:
                    type: object
