  /external-accounts/private/v1/account:
    get:
      security:
        - bearerAuth: []
      tags:
        - External Accounts
      summary: List external accounts
      description: >-
        Retrieves a paginated list of external bank accounts with filtering and
        search capabilities
      operationId: GetAccounts
      parameters:
        - in: header
          schema:
            type: string
          required: true
          name: Authorization
          description: Must be a token string with `Bearer` eg. `Bearer refreshtoken123`
        - name: page[limit]
          in: query
          description: Number of records per page (default 20, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: page[number]
          in: query
          description: Page number (1-based indexing)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - in: query
          name: sort
          description: Sort order for results
          schema:
            type: string
            enum:
              - id
              - '-id'
              - createdAt
              - '-createdAt'
            default: '-createdAt'
            example: '-createdAt'
        - in: query
          name: filter[ownerId]
          description: Filter accounts by owner ID (exact match)
          schema:
            type: string
            format: uuid
            example: b0bf93db-3a91-4e05-8453-4a54ccedbf35
          required: false
        - in: query
          name: filter[type]
          description: Filter accounts by account type (exact match)
          schema:
            type: string
            enum:
              - checking
              - savings
              - credit_card
              - loan
              - investment
            example: checking
          required: false
        - in: query
          name: filter[ownerRole]
          description: Filter by account owner role
          schema:
            type: string
            enum:
              - individual
              - businessowner
            example: individual
          required: false
        - in: query
          name: search[id-name]
          description: Full-text search by account ID and business name
          schema:
            type: string
            example: Chase Business
          required: false
        - in: query
          name: search[number-name]
          description: Full-text search by account number and business name
          schema:
            type: string
            example: '****1234'
          required: false
      responses:
        '200':
          description: List of external accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Account'
                        - type: object
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              examples:
                accountsList:
                  summary: Successful accounts list
                  value:
                    data:
                      - id: ext_acc_12345
                        type: checking
                        number: '****1234'
                        routingNumber: '021000021'
                        accountName: Business Checking
                        ownerName: John Doe
                        bankName: Chase Bank
                        bankLogoURL: https://logos.bank.com/chase.png
                        businessProfile:
                          name: ABC Corp
