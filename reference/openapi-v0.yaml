                        example: 150
                      page:
                        type: integer
                        description: Current page number
                        example: 1
                      limit:
                        type: integer
                        description: Records per page
                        example: 10
                      pages:
                        type: integer
                        description: Total number of pages
                        example: 15
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                Invalid pagination:
                  value:
                    errors:
                      - code: INVALID_REQUEST_PARAMETER
