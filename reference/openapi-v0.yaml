  /accounts/private/v1/transactions/balance-chart:
    get:
      security:
        - bearerAuth: []
      tags:
        - Transactions
      summary: Get balance chart data
      description: >
        Returns balance chart data showing balance changes over time for
        specified accounts.


        **List of possible error codes**:


        | Code                     | Status |
        Description                                          |

        |--------------------------|--------|------------------------------------------------------|

        | INVALID_QUERY_PARAMETERS | 400    | Query parameters are invalid or
        missing             |

        | FORBIDDEN                | 403    | Access denied to one or more
        accounts               |

        | INTERNAL_ERROR           | 500    | Internal server
        error                                |
      operationId: getBalanceChart
      parameters:
        - name: accountIds
          in: query
          description: Array of account IDs (comma-separated)
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            example:
              - 1
              - 2
              - 3
          style: form
          explode: false
        - name: period
          in: query
          description: >
            Predefined time period for the chart:

            - 12months: Last 12 months with bi-monthly periods (24 data points -
            first and second half of each month)

            - 30days: Last 30 days (30 data points, daily)

            - 7days: Last 7 days (14 data points, every 12 hours)

            - 24hours: Last 24 hours (24 data points, hourly)


            For 12months period, data points represent:

            - First half of month (1st-15th): timestamp shows 1st day of month

            - Second half of month (16th-end): timestamp shows 16th day of month
          required: true
          schema:
            type: string
            enum:
              - 12months
              - 30days
              - 7days
              - 24hours
            example: 30days
      responses:
        '200':
          description: Successful request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      points:
                        type: array
                        description: Array of balance chart points
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: string
                              format: date-time
                              description: >
                                Timestamp of the data point.

                                For 12months period with bi-monthly grouping:

                                - First half timestamps end with "01T00:00:00Z"
                                (e.g., "2024-01-01T00:00:00Z")

                                - Second half timestamps end with "16T00:00:00Z"
                                (e.g., "2024-01-16T00:00:00Z")
                              example: '2024-01-01T00:00:00Z'
                            balance:
                              type: string
                              description: Balance amount at this timestamp
                              example: '1500.00'
                          required:
                            - timestamp
                            - balance
                      meta:
                        type: object
                        description: Metadata about the request
                        properties:
                          accountIds:
                            type: array
                            items:
                              type: integer
                            description: Account IDs used in the request
                            example:
                              - 1
                              - 2
                              - 3
                          period:
                            type: string
                            description: Time period from request
                            example: 30days
                          dateFrom:
                            type: string
                            format: date-time
                            description: Calculated start date based on period
                            example: '2024-01-01T00:00:00Z'
                          dateTo:
                            type: string
                            format: date-time
                            description: Calculated end date (current time)
                            example: '2024-01-31T23:59:59Z'
                          points:
                            type: integer
                            description: Number of points based on period
                            example: 30
                          transactionType:
                            type: string
                            description: Transaction type from request
                            example: all
                        required:
                          - accountIds
                          - period
                          - dateFrom
                          - dateTo
                          - points
                          - transactionType
                    required:
                      - points
                      - meta
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal Server Error
  /accounts/private/v1/transactions/transactions-chart:
    get:
      security:
        - bearerAuth: []
      tags:
        - Transactions
      summary: Get transaction sums chart data
      description: >
        Returns transaction sums chart data showing total transaction amounts
        for the current month.

        The data is always grouped into 5 columns representing equal divisions
        of the current month.


        **Key features**:

        - Always shows data for the current month (from 1st to last day)

        - Returns exactly 5 data points dividing the month into equal parts

        - Future columns (after current date) will exist but contain zero values

        - Transaction amounts are shown as absolute values (positive)


        **List of possible error codes**:


        | Code                     | Status |
        Description                                          |

        |--------------------------|--------|------------------------------------------------------|

        | INVALID_QUERY_PARAMETERS | 400    | Query parameters are
        invalid                        |

        | ACCOUNT_NOT_FOUND        | 404    | One or more specified accounts not
        found           |

        | FORBIDDEN                | 403    | Access denied to one or more
        accounts               |

        | INTERNAL_ERROR           | 500    | Internal server
        error                                |
      operationId: getTransactionChart
      parameters:
        - name: accountIds
          in: query
          description: >-
            Array of account IDs to filter by (comma-separated). If not
            provided, all accessible accounts will be included.
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
            example:
              - 1
              - 2
              - 3
          style: form
          explode: false
        - name: transactionType
          in: query
          description: |
            Filter transactions by type:
            - income: Only positive transactions (credits)
            - expense: Only negative transactions (debits)
          required: true
          schema:
            type: string
            enum:
              - income
              - expense
            example: income
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      points:
                        type: array
                        description: Array of 5 data points for the current month
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: string
                              format: date-time
                              description: >-
                                ISO 8601 timestamp representing the middle of
                                the column period
                              example: '2025-06-06T12:00:00Z'
                            sum:
                              type: string
                              description: >-
                                Total sum of transactions in this period (as
                                string to preserve precision)
                              example: '1234.56'
                          required:
                            - timestamp
                            - sum
                        minItems: 5
                        maxItems: 5
                      meta:
                        type: object
                        properties:
                          accountIds:
                            type: array
                            items:
                              type: integer
                              format: int64
                            description: Account IDs included in the chart
                            example:
                              - 1
                              - 2
                              - 3
                          dateFrom:
                            type: string
                            format: date-time
                            description: >-
                              Start date of the period (1st day of current
                              month)
                            example: '2025-06-01T00:00:00Z'
                          dateTo:
                            type: string
                            format: date-time
                            description: End date of the period (last day of current month)
                            example: '2025-06-30T23:59:59Z'
                          points:
                            type: integer
                            description: Number of data points (always 5)
                            example: 5
                          transactionType:
                            type: string
                            description: Transaction type filter applied
                            example: all
                        required:
                          - accountIds
                          - dateFrom
                          - dateTo
                          - points
                          - transactionType
                    required:
                      - points
                      - meta
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Internal Server Error
  /accounts/private/v1/balance/total:
