                        title: Invalid branch ID format
        '401':
          description: Authentication error
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                Access denied:
                  value:
                    errors:
                      - code: NO_ACCESS_TO_ACTION
